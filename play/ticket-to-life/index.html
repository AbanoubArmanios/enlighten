  const outfit=`hsl(${hue},60%,58%)`, outfit2=`hsl(${hue},60%,44%)`, aura=`hsl(${hue},80%,86%)`;
  const eyeDX=15, eyeY=cy-6, my=cy+22, top=cy-ry, bot=cy+ry, bodyTop=bot+22;
  const id='pp'+Math.random().toString(36).slice(2,8);
  let back='', hairTop='', beard='', extra='';
  // ---- hair behind the head
  if(p.hair==='long')  back=`<path d="M${cx-rx-6} ${cy-10} Q ${cx-rx-12} ${bodyTop+30} ${cx-rx+4} ${bodyTop+34} L ${cx+rx-4} ${bodyTop+34} Q ${cx+rx+12} ${bodyTop+30} ${cx+rx+6} ${cy-10} Z" fill="${hairCol}"/>`;
  if(p.hair==='wavy')  back=`<path d="M${cx-rx-8} ${cy-6} q-12 34 2 58 q-8 24 10 36 L ${cx+rx-10} ${bodyTop+30} q18 -12 10 -36 q14 -24 2 -58 Z" fill="${hairCol}"/>`;
  if(p.hair==='curly' && p.gender!=='m') back=`<g fill="${hairCol}">${[-1,-0.6,-0.2,0.2,0.6,1].map(k=>`<circle cx="${cx+k*rx*1.05}" cy="${cy+ry*0.5}" r="15"/>`).join('')}${[-0.85,-0.3,0.3,0.85].map(k=>`<circle cx="${cx+k*rx*1.1}" cy="${cy+ry*0.9}" r="14"/>`).join('')}</g>`;   // men: short curls only
  // ---- hair on top (clipped to a slightly bigger head so it always hugs the skull)
  const cap=`<clipPath id="${id}"><ellipse cx="${cx}" cy="${cy}" rx="${rx+3}" ry="${ry+3}"/></clipPath>`;
  const fringe=`<path clip-path="url(#${id})" d="M${cx-rx-4} ${cy+2} L ${cx-rx-4} ${top-6} L ${cx+rx+4} ${top-6} L ${cx+rx+4} ${cy+2} Q ${cx+rx-6} ${cy-ry*0.55} ${cx+6} ${cy-ry*0.5} Q ${cx-10} ${cy-ry*0.3} ${cx-rx+8} ${cy-ry*0.4} Q ${cx-rx} ${cy-ry*0.2} ${cx-rx-4} ${cy+2} Z" fill="${hairCol}"/>`;
  if(p.hair==='buzz')       hairTop=`<path clip-path="url(#${id})" d="M${cx-rx-4} ${cy-ry*0.28} L ${cx-rx-4} ${top-6} L ${cx+rx+4} ${top-6} L ${cx+rx+4} ${cy-ry*0.28} Z" fill="${hairCol}" opacity=".92"/>`;
  else if(p.hair==='bun')   hairTop=fringe+`<circle cx="${cx}" cy="${top-4}" r="15" fill="${hairCol}"/>`;
  else if(p.hair==='curly') hairTop=`<g fill="${hairCol}">${[-0.9,-0.55,-0.2,0.2,0.55,0.9].map(k=>`<circle cx="${cx+k*rx}" cy="${top+6}" r="15"/>`).join('')}<circle cx="${cx-rx*0.4}" cy="${top-4}" r="14"/><circle cx="${cx+rx*0.4}" cy="${top-4}" r="14"/></g>`;
  else if(p.hair==='wavy')  hairTop=fringe;
  else                      hairTop=fringe;   // short / long
  // ---- body (starts under the chin so the neck connects)
  let body=`<path d="M${cx-sh} 260 L${cx-sh} ${bodyTop+34} Q ${cx-sh} ${bodyTop+6} ${cx-18} ${bodyTop} L ${cx+18} ${bodyTop} Q ${cx+sh} ${bodyTop+6} ${cx+sh} ${bodyTop+34} L ${cx+sh} 260 Z" fill="${outfit}"/>`;
  const bt=bodyTop;
  if(p.outfit==='hoodie') body+=`<path d="M${cx-34} ${bt} Q ${cx} ${bt+22} ${cx+34} ${bt} L ${cx+40} ${bt+18} Q ${cx} ${bt+46} ${cx-40} ${bt+18} Z" fill="${outfit2}"/><line x1="${cx-10}" y1="${bt+18}" x2="${cx-12}" y2="${bt+60}" stroke="#fff" stroke-width="3" opacity=".7"/><line x1="${cx+10}" y1="${bt+18}" x2="${cx+12}" y2="${bt+60}" stroke="#fff" stroke-width="3" opacity=".7"/>`;
  else if(p.outfit==='shirt') body+=`<path d="M${cx-18} ${bt} L${cx} ${bt+20} L${cx+18} ${bt} L${cx+10} ${bt-2} L${cx} ${bt+10} L${cx-10} ${bt-2} Z" fill="#fff"/><path d="M${cx-4} ${bt+12} L${cx+4} ${bt+12} L${cx+3} ${bt+54} L${cx-3} ${bt+54} Z" fill="${outfit2}"/>`;
  else if(p.outfit==='blazer') body+=`<path d="M${cx-sh+6} ${bt+34} L${cx-16} ${bt} L${cx-2} ${bt+36} L${cx-8} 260 L${cx-sh+6} 260 Z" fill="${outfit2}"/><path d="M${cx+sh-6} ${bt+34} L${cx+16} ${bt} L${cx+2} ${bt+36} L${cx+8} 260 L${cx+sh-6} 260 Z" fill="${outfit2}"/><path d="M${cx-16} ${bt} L${cx} ${bt+18} L${cx+16} ${bt} Z" fill="#fff"/>`;
  else if(p.outfit==='dress') body+=`<path d="M${cx-30} ${bt} Q ${cx} ${bt+30} ${cx+30} ${bt} Z" fill="${skin}"/><circle cx="${cx}" cy="${bt+10}" r="5" fill="#ffd24a"/>`;
  else body+=`<path d="M${cx-16} ${bt} L${cx} ${bt+18} L${cx+16} ${bt} Z" fill="${outfit2}"/>`;
  // ---- face
  const eyes=`<path d="M${cx-eyeDX-7} ${eyeY+2} q7 -8 14 0" stroke="#3a2b50" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M${cx+eyeDX-7} ${eyeY+2} q7 -8 14 0" stroke="#3a2b50" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  const brows=`<path d="M${cx-eyeDX-8} ${eyeY-11} q8 -4 16 0" stroke="${hairCol}" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".8"/><path d="M${cx+eyeDX-8} ${eyeY-11} q8 -4 16 0" stroke="${hairCol}" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".8"/>`;
  const nose=`<path d="M${cx} ${eyeY+6} q-4 9 3 12" stroke="rgba(0,0,0,.18)" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  const mouth=`<path d="M${cx-16} ${my} q16 15 32 0" stroke="${p.lips||'#b5536b'}" stroke-width="3.6" fill="none" stroke-linecap="round"/>`;
  const cheeks=`<circle cx="${cx-26}" cy="${cy+10}" r="6" fill="#ff9ec7" opacity=".45"/><circle cx="${cx+26}" cy="${cy+10}" r="6" fill="#ff9ec7" opacity=".45"/>`;
  const gl=p.glasses?`<g stroke="#4a4a5e" stroke-width="2.6" fill="rgba(255,255,255,.18)"><rect x="${cx-eyeDX-12}" y="${eyeY-10}" width="24" height="18" rx="6"/><rect x="${cx+eyeDX-12}" y="${eyeY-10}" width="24" height="18" rx="6"/><line x1="${cx-3}" y1="${eyeY-1}" x2="${cx+3}" y2="${eyeY-1}"/></g>`:'';
  if(p.beard==='stubble') beard=`<path clip-path="url(#${id})" d="M${cx-rx-4} ${cy+10} L ${cx+rx+4} ${cy+10} L ${cx+rx+4} ${bot+6} L ${cx-rx-4} ${bot+6} Z" fill="${hairCol}" opacity=".22"/>`;
  else if(p.beard) beard=`<path d="M${cx-rx+2} ${cy+6} Q ${cx-rx} ${bot+14} ${cx} ${bot+18} Q ${cx+rx} ${bot+14} ${cx+rx-2} ${cy+6} Q ${cx+rx-10} ${cy+30} ${cx} ${cy+34} Q ${cx-rx+10} ${cy+30} ${cx-rx+2} ${cy+6} Z" fill="${hairCol}"/><ellipse cx="${cx}" cy="${my+1}" rx="15" ry="7" fill="${skin}"/>`;
  if(p.earrings) extra+=`<circle cx="${cx-rx-1}" cy="${cy+16}" r="4" fill="#ffd24a"/><circle cx="${cx+rx+1}" cy="${cy+16}" r="4" fill="#ffd24a"/>`;
  return `<svg viewBox="4 22 212 200" xmlns="http://www.w3.org/2000/svg"><defs>${cap}</defs>
    <ellipse cx="${cx}" cy="150" rx="102" ry="128" fill="${aura}" opacity=".32"/>
    ${back}${body}
    <rect x="${cx-14}" y="${bot-14}" width="28" height="${bodyTop-bot+20}" rx="10" fill="${skin}"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${skin}"/>
    ${cheeks}${beard}${brows}${eyes}${gl}${nose}${mouth}${hairTop}${extra}

};

function _pron(L){ return (L&&L.gender==='f')?{he:'she',him:'her',his:'her',He:'She'}:{he:'he',him:'him',his:'his',He:'He'}; }
function _extraPerson(key, rel, pool){ const name=pickName(S,key,pool||'extra'); const look=_lookOf(key,rel,name); return {key,name,rel,hue:look.hue,extra:true}; }
function _personByKey(k){
  const p=(S.people||[]).find(x=>x.key===k); if(p) return p;
  if(k==='neighbour') return _extraPerson('neighbour','Neighbour');
  if(k==='cousin') return _extraPerson('cousin','Cousin');
  return null;
}
function _pickCaller(evKey, pool){
  const saved=S.flags['caller:'+evKey];
  if(saved){ const p=_personByKey(saved); if(p) return p; }
  const usedKeys=new Set(Object.keys(S.flags).filter(k=>k.indexOf('caller:')===0).map(k=>S.flags[k]));
  let cands=pool.filter(p=>!usedKeys.has(p.key)); if(!cands.length) cands=pool;
  const p=cands[Math.floor(Math.random()*cands.length)];
  S.flags['caller:'+evKey]=p.key; return p;
}
function _pool(kind){
  const P=(S.people||[]);
  const friends=P.filter(p=>p.rel==='Friend'||p.rel==='Colleague'||p.rel==='Mentee');
  const parents=P.filter(p=>p.rel==='Mother'||p.rel==='Father');
  if(kind==='leg')   return friends.concat(parents, [_extraPerson('neighbour','Neighbour')]);
  if(kind==='loan')  return friends.concat([_extraPerson('cousin','Cousin')]);
  if(kind==='car')   return friends.concat(parents, [_extraPerson('cousin','Cousin')]);
  if(kind==='teach') return friends.concat([_extraPerson('neighbour','Neighbour')]);
  return friends.length?friends:[_extraPerson('neighbour','Neighbour')];
}
function _portraitOf(p){ const look=_lookOf(p.key,p.rel,p.name); return _partnerSVG(Object.assign({hue:p.hue},look)); }
function _relWord(p){ const m={Friend:'your friend',Colleague:'your colleague',Mentee:'the young person you mentor',Mother:'your mother',Father:'your father',Neighbour:'your neighbour',Cousin:'your cousin',Partner:'your partner',Spouse:'your spouse',Child:'your child'}; return m[p.rel]||p.rel.toLowerCase(); }

const NEEDS={
  move:  { stage:2, atStep:2, em:'📦', title:'Moving day', ctx:'New apartment. Fourth floor. No lift. Forty boxes and one weekend.', ask:'help you move',
           alone:{money:300,energy:12}, helped:{social:4,energy:-3}, art:P=>_artMove(P), aloneText:'Movers and a lost weekend.' },

           alone:{money:500,energy:10,health:2}, helped:{health:5,social:5}, art:P=>_artFall(P), aloneText:'Taxis and long waiting rooms, alone.' },
};
function _contacts(){
  const P=(S.people||[]).filter(p=>p.rel!=='Child' || S.stageIndex>=5);
  const extras=['neighbour','cousin'].filter(k=>S.flags['fav:'+k]!==undefined).map(k=>_personByKey(k)).filter(Boolean);
  return P.concat(extras);
}
function _hint(p){
  const f=_fav(p.key), fam=['Mother','Father','Spouse'].includes(p.rel);
  if(f>0) return '<span class="cp-hint owe">🤝 Owes you one</span>';
  if(f<0) return '<span class="cp-hint cold">❄️ You let them down</span>';
  if(fam) return '<span class="cp-hint fam">Family</span>';
  if(p.rel==='Child') return '<span class="cp-hint fam">Your child</span>';
  if(p.rel==='Partner') return '<span class="cp-hint">Dating</span>';
  return '<span class="cp-hint">No history yet</span>';
}
function _contactHTML(p){ return `<span class="cp"><span class="cp-av" style="background:radial-gradient(circle at 35% 30%, hsl(${p.hue||200},90%,86%), hsl(${p.hue||200},70%,66%))">${_portraitOf(p)}</span><span><span class="cp-name">Call ${p.name}</span><span class="cp-rel">${p.rel}</span></span></span>`; }
function _applyEff(e,sign){ for(const k in e){ if(k in S) S[k]+=sign*e[k]; } }
function _costLine(e){ const parts=[]; if(e.money) parts.push(_fmt(e.money)); if(e.energy) parts.push('Energy −'+e.energy); if(e.health) parts.push('Health −'+e.health); return parts.join(', '); }
function _gainLine(e){ const parts=[]; for(const k in e){ const v=e[k]; const n={social:'Social',health:'Health',energy:'Energy',mind:'Intelligence',money:'Money'}[k]||k; parts.push(n+' '+(v>0?'+':'−')+Math.abs(v)); } return parts.join(', '); }
function _resolveHelp(p, N){
  const f=_fav(p.key), fam=['Mother','Father','Spouse'].includes(p.rel), L=_lookOf(p.key,p.rel,p.name), pr=_pron(L);
  let helps, why='';
  if(f>0){ helps=true; why=S.flags['owe:'+p.key]||'You were there for me once.'; }
  else if(f<0){ helps=false; why=S.flags['why:'+p.key]||'that time you couldn’t'; }
  else if(fam){ helps=true; why='family'; }
  else if(p.rel==='Child'){ helps=S.stageIndex>=5; why='family'; }
  else { helps = S.social>=55; why='none'; }
  if(helps){
    _applyEff(N.helped,+1);
    if(f>0) _addFav(p.key,-1);                        // the favour is returned — the slate is clean again
    const quote = why==='family' ? '“Don’t be silly. Of course.”' : why==='none' ? '“Sure — I mean, you never asked before, but sure.”' : '“'+why+' Get in.”';
    const tail = why==='family' ? 'Family doesn’t keep score.' : why==='none' ? 'No history between you — but you have enough goodwill in the world that '+pr.he+' said yes.' : 'That favour is now returned; you start even again.';
    _queueHidden({icon:'🤝',title:p.name+' didn’t hesitate',detail:quote+' '+tail+' <b>'+_gainLine(N.helped)+'</b> — and not a dollar spent.'});
  } else {
    _applyEff(N.alone,-1); S.social-=2;
    const quote = f<0 ? '“I’m… really busy this month.” You both remembered '+why+'.' : '“I wish I could…” '+pr.He+' didn’t owe you anything, and you haven’t been the easiest person to reach.';
    _queueHidden({icon:'📵',title:p.name+' was “really busy this month”',detail:quote+' In the end: <span class="cons-cost">'+_costLine(N.alone)+', Social −2</span>. The call itself was the worst part.'});
  }
}
function _needCfg(key){
  const N=NEEDS[key], P=_playerLook();
  const opts=_contacts().map(p=>({ t:_contactHTML(p), c:_hint(p), contact:true, apply:()=>_resolveHelp(p,N) }));
  opts.push({ t:'Handle it yourself', c:N.aloneText+' Costs '+_costLine(N.alone)+'.', alone:true, apply:()=>{ _applyEff(N.alone,-1);
    _queueHidden({icon:'🚕',title:'You managed alone',detail:N.aloneText+' <span class="cons-cost">'+_costLine(N.alone)+'</span>. It was fine. It was just… quiet.'}); } });
  return { ring:false, em:N.em, title:N.title, caller:'You', ctx:N.ctx, art:N.art(P), picker:true,
    lines:[{t:'You need someone to '+N.ask+'. You scroll through your contacts… who do you call?',you:true}], options:opts };
}
Object.keys(NEEDS).forEach(k=>LIFE_CALLS.push({ key:k, stage:NEEDS[k].stage, atStep:NEEDS[k].atStep, cond:s=>true, cfg:()=>_needCfg(k) }));

/* 10) refresh-safe calls: a call is "pending" until answered, and rings again if you reload mid-call */
_dueCall=function(){
  if(!S || S.dead) return null;
  for(const ev of LIFE_CALLS){
    const f=S.flags['call_'+ev.key];
    if(S.stageIndex===ev.stage && S.stepIndex===ev.atStep && (!f || f==='pending') && ev.cond(S)) return ev;
  }
  return null;
};
(function(){
  const _rs=renderStep;
  renderStep=function(){
    const ev=_dueCall();
    if(ev){
      S.flags['call_'+ev.key]='pending'; try{ if(typeof MP!=='undefined'&&MP.active&&MP.saveTeam) MP.saveTeam(); }catch(e){}
      const cfg=ev.cfg();
      (cfg.options||[]).forEach(o=>{ const a=o.apply; o.apply=function(){ S.flags['call_'+ev.key]='done'; try{ return a&&a.apply(this,arguments); } finally { try{ if(typeof MP!=='undefined'&&MP.active&&MP.saveTeam) MP.saveTeam(); }catch(e){} } }; });
      if(!cfg.after) cfg.after=()=>renderStep();
      _scene(cfg); return;
    }
    return _rs.apply(this,arguments);
  };
})();

/* 11) the ring screen shows who is calling; contact pickers lay out as a grid */
(function(){
  const _s=_scene;
  _scene=function(cfg){
    const r=_s(cfg);
    try{
      const ov=[...document.querySelectorAll('.call-ov')].pop(); if(!ov) return r;
      if(cfg && cfg.portrait){
        const ring=ov.querySelector('.call-ring');
        if(ring){ const d=document.createElement('div'); d.className='call-portrait'; d.innerHTML=cfg.portrait+'<span class="ph">📞</span>'; ring.replaceWith(d); }
      }
      if(cfg && cfg.picker){
        const g=ov.querySelector('.call-opts'); if(g) g.classList.add('contacts');
        ov.querySelectorAll('.call-opt').forEach((el,i)=>{ const o=cfg.options[i]; if(o&&o.alone) el.classList.add('alone'); if(o&&o.contact) el.classList.add('contact'); });
      }
    }catch(e){}
    return r;
  };
})();

const REL_OF_POOL={friend:'Friend',kid:'Child',colleague:'Colleague',mentee:'Mentee',neighbour:'Neighbour',cousin:'Cousin',partner:'Partner'};
pickName=function(s,key,pool){
  s._nameCache=s._nameCache||{};
  if(pool==='extra') pool=key;                       // 'neighbour' / 'cousin'
  if(!s._nameCache[key]){
    let g=null; const rel=REL_OF_POOL[pool];

(function(){

  else if(man && p.beard) beard=`<path d="M${cx-rx+2} ${cy+6} Q ${cx-rx} ${bot+14} ${cx} ${bot+18} Q ${cx+rx} ${bot+14} ${cx+rx-2} ${cy+6} Q ${cx+rx-10} ${cy+30} ${cx} ${cy+34} Q ${cx-rx+10} ${cy+30} ${cx-rx+2} ${cy+6} Z" fill="${hairCol}"/><ellipse cx="${cx}" cy="${my+1}" rx="15" ry="7" fill="${skin}"/>`;
  if(!man && p.earrings) extra+=`<circle cx="${cx-rx-1}" cy="${cy+16}" r="4" fill="#ffd24a"/><circle cx="${cx+rx+1}" cy="${cy+16}" r="4" fill="#ffd24a"/>`;
  const headShape = man ? `<rect x="${cx-rx}" y="${top}" width="${rx*2}" height="${ry*2}" rx="${rx*0.8}" ry="${ry*0.7}" fill="${skin}"/>` : `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${skin}"/>`;
  const ears = man ? `<circle cx="${cx-rx}" cy="${cy+6}" r="7" fill="${skin}"/><circle cx="${cx+rx}" cy="${cy+6}" r="7" fill="${skin}"/>` : '';
  return `<svg viewBox="4 22 212 200" xmlns="http://www.w3.org/2000/svg"><defs>${cap}</defs>
    <ellipse cx="${cx}" cy="150" rx="102" ry="128" fill="${aura}" opacity=".32"/>
    ${back}${body}
    <rect x="${cx-(man?17:14)}" y="${bot-14}" width="${man?34:28}" height="${bodyTop-bot+20}" rx="10" fill="${skin}"/>
    ${ears}${headShape}
    ${cheeks}${beard}${brows}${eyes}${gl}${nose}${mouth}${hairTop}${extra}
  </svg>`;
};

(function(){ const css=`

/* ---------- ticket codes (enlighten-website Firestore, named app) ---------- */
const CODES = {
  CFG:{"apiKey":"AIzaSyAWx1VbP6w6s0gt0YFBiylg_vj0q4ux7BY","authDomain":"enlighten-website-75dfd.firebaseapp.com","projectId":"enlighten-website-75dfd","storageBucket":"enlighten-website-75dfd.firebasestorage.app","messagingSenderId":"629120766450","appId":"1:629120766450:web:50be642246ec032bd91b6b"},
  BUY_URL:'https://enlightensim.org/learn/?p=ttl',
  RE:/^TTL-[A-Z0-9]{5}-[A-Z0-9]{5}$/,
  db:null,
  init(){ try{ if(!window.firebase||!firebase.firestore) return false;
      const app = firebase.apps.find(a=>a.name==='enlighten') || firebase.initializeApp(this.CFG,'enlighten');
      this.db=app.firestore(); return true; }catch(e){ console.error('codes init',e); return false; } },
  norm(c){ return String(c||'').trim().toUpperCase().replace(/\s+/g,''); },
  deviceId(){ try{ let d=localStorage.getItem('ttl_device'); if(!d){ d='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,10); localStorage.setItem('ttl_device',d); } return d; }catch(e){ return 'd-nostorage'; } },
  ref(code){ return this.db.collection('ttlCodes').doc(code); },
  /* resolve: {ok:true} | {ok:false, msg} */
  async claim(code){
    code=this.norm(code);
    if(!this.RE.test(code)) return {ok:false, msg:"That code isn't valid."};
    if(!this.db && !this.init()) return {ok:false, msg:'Could not reach the ticket service. Check your connection and try again.'};
    let snap; try{ snap=await this.ref(code).get(); }catch(e){ console.error(e); return {ok:false, msg:'Could not reach the ticket service. Check your connection and try again.'}; }
    if(!snap.exists) return {ok:false, msg:"That code isn't valid."};
    const d=snap.data()||{}; const dev=this.deviceId();
    if(d.status==='used') return {ok:false, msg:'This ticket has already been used. Get a new ticket to play again.'};
    if(d.status==='active'){ if(d.device===dev) return {ok:true, code, resumed:true}; return {ok:false, msg:'This ticket is already in use on another device.'}; }
    if(d.status==='new'){
      try{ await this.ref(code).update({status:'active', device:dev, activatedAt:firebase.firestore.FieldValue.serverTimestamp()}); }
      catch(e){ console.error(e); return {ok:false, msg:'Could not activate this ticket right now. Please try again.'}; }
      return {ok:true, code};
    }
    return {ok:false, msg:"That code isn't valid."};
  },
  async finish(code){ code=this.norm(code); if(!code) return false;
    if(!this.db && !this.init()) return false;
    try{ await this.ref(code).update({status:'used', finishedAt:firebase.firestore.FieldValue.serverTimestamp()}); return true; }catch(e){ console.error('finish',e); return false; } }
};

const MP = {
  active:false, role:null, teamId:null, view:'login', solo:true, roomCode:null,
  cache:{room:null, teams:{}},
  app(){ return document.getElementById('app'); },
  online(){ return false; },
  snd(){ if(typeof Sound!=='undefined') Sound.click(); },
  readRoom(){ return this.cache.room; }, writeRoom(r){ this.cache.room=r; },
  readTeam(id){ return this.cache.teams[id]; }, writeTeam(t){ this.cache.teams[t.id]=t; },
  allTeams(){ return Object.values(this.cache.teams||{}); },
  openStage(){ return STAGES.length-1; },
  joinRoomChannel(){}, checkOpen(){}, renderWaiting(){},
  _saved(){ try{ return JSON.parse(localStorage.getItem('ttl_solo')||'null'); }catch(e){ return null; } },
  _code(){ try{ return localStorage.getItem('ttl_solo_code')||''; }catch(e){ return ''; } },

  /* ---------- entry ---------- */
  init(){
    let fresh=false, urlCode='';
    try{ const q=new URLSearchParams(location.search); fresh=q.has('new')||q.has('fresh'); urlCode=CODES.norm(q.get('code')||''); }catch(e){}
    this.active=false; this.teamId=null; this.view='login'; this._finished=false; try{_setUrl();}catch(e){}
    if(fresh){ try{ localStorage.removeItem('ttl_solo'); localStorage.removeItem('ttl_solo_code'); localStorage.removeItem('ttl_role'); }catch(e){} try{ history.replaceState(null,'',location.pathname+location.hash); }catch(e){} }
    // resume an unfinished life on this device (no code prompt)
    if(!fresh && !this._noResume){ const t=this._saved(); if(t && !t.finished){ this.startSolo(t); return; } }
    this._noResume=false;
    this.codeScreen(urlCode);
  },

  /* ---------- 1. ticket code ---------- */
  codeScreen(prefill){ this.view='code'; try{_setUrl();}catch(e){}
    this.app().innerHTML=`<div class="mp-wrap"><div class="mp-hero">
        <div class="big">🎟️</div><h1>Ticket to Life</h1>
        <p>One life. Seven chapters. Every choice spends a resource.</p>
      </div>
      <div class="mp-card">
        <h2>Your ticket</h2><div class="sub">Enter the ticket code you received to start your life.</div>
        <label>Ticket code</label>
        <input id="tcode" class="code" placeholder="TTL-XXXXX-XXXXX" maxlength="15" autocomplete="off" autocapitalize="characters" spellcheck="false" value="${_esc(prefill||'')}"/>
        <div class="mp-err" id="tErr"></div>
        <button class="btn btn-go" style="width:100%" id="tGo">Validate ticket ▸</button>
        <a class="mp-link" href="${CODES.BUY_URL}" target="_blank" rel="noopener">Don't have a code? Get your ticket →</a>
      </div></div>`;
    try{ if(typeof TL_BUILD!=='undefined') this.app().insertAdjacentHTML('beforeend','<div class="build-tag">Ticket to Life · Solo edition · build '+TL_BUILD+'</div>'); }catch(e){}
    const inp=document.getElementById('tcode'), err=document.getElementById('tErr'), btn=document.getElementById('tGo');
    inp.addEventListener('input',()=>{ let v=inp.value.toUpperCase().replace(/[^A-Z0-9]/g,''); if(v.startsWith('TTL')) v=v.slice(3); v=v.slice(0,10); inp.value = v.length? 'TTL-'+v.slice(0,5)+(v.length>5?'-'+v.slice(5):'') : ''; });
    const go=async()=>{ if(this._busy) return; const code=CODES.norm(inp.value); err.textContent='';
      if(!CODES.RE.test(code)){ err.textContent="That code isn't valid."; if(typeof Sound!=='undefined')Sound.bad(); return; }
      this._busy=true; btn.disabled=true; btn.textContent='Checking…';
      const r=await CODES.claim(code);
      this._busy=false; btn.disabled=false; btn.textContent='Validate ticket ▸';
      if(!r.ok){ err.textContent=r.msg; if(typeof Sound!=='undefined')Sound.bad(); return; }
      try{ localStorage.setItem('ttl_solo_code', r.code); }catch(e){}
      this.snd(); this.setupScreen(r.code);
    };
    btn.onclick=go; inp.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
    if(prefill && CODES.RE.test(CODES.norm(prefill))) setTimeout(go, 150); else setTimeout(()=>inp.focus(),80);
  },

  /* ---------- 2. name + character ---------- */
  setupScreen(code){ this.view='setup'; let g='m'; try{_setUrl();}catch(e){}
    this.app().innerHTML=`<div class="mp-wrap"><div class="mp-card">
      <div style="text-align:center"><span class="mp-ticket">🎟️ ${_esc(code)}</span></div>
      <h2>Who are you?</h2><div class="sub">Your own life, seven chapters, from 18 to 75.</div>
      <label>Your name</label>
      <input id="sname" maxlength="20" placeholder="e.g. Sara" autocomplete="off"/>
      <label>Your character</label>
      <div class="mp-genders" id="sg">
        <div class="mp-g sel" data-g="m"><span class="e">👨</span>Male</div>
        <div class="mp-g" data-g="f"><span class="e">👩</span>Female</div>
      </div>
      <div class="mp-err" id="sErr"></div>
      <button class="btn btn-go" style="width:100%" id="sGo">Start my life ▸</button>
    </div></div>`;
    document.querySelectorAll('#sg .mp-g').forEach(el=>el.onclick=()=>{ this.snd(); g=el.dataset.g; document.querySelectorAll('#sg .mp-g').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); });
    const go=()=>{ const name=(document.getElementById('sname').value||'').trim().replace(/[<>&"'`]/g,'').slice(0,20);
      if(!name){ document.getElementById('sErr').textContent='Please enter your name.'; if(typeof Sound!=='undefined')Sound.bad(); return; }
      const t={ id:'solo'+Date.now().toString(36), code, name, gender:g, stageIndex:0, money:500, health:100, energy:70, mind:20, social:50, flags:{}, log:[], stageChoices:[], people:[], finished:false };
      this.snd(); this.startSolo(t); };
    document.getElementById('sGo').onclick=go;
    document.getElementById('sname').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
    setTimeout(()=>{ const el=document.getElementById('sname'); if(el) el.focus(); },80);
  },

  /* ---------- 3. play ---------- */
  startSolo(t){
    this.solo=true; this.role='solo'; this.cache.room={created:true, code:'SOLO', openStage:STAGES.length-1}; this.cache.teams={}; this.cache.teams[t.id]=t;
    if(t.code){ try{ localStorage.setItem('ttl_solo_code', t.code); }catch(e){} }
    try{ localStorage.setItem('ttl_role','solo'); localStorage.setItem('ttl_solo', JSON.stringify(t)); }catch(e){}
    this.startTeam(t);
  },
  startTeam(t){
    this.active=true; this.teamId=t.id; this.view='play'; this._finished=!!t.finished;
    S=freshState(); S.name=t.name; S.gender=t.gender; S.tutorialDone=true;
    if(t.money!==undefined){ S.money=t.money;S.health=t.health;S.energy=t.energy;S.mind=t.mind;S.social=t.social;
      S.flags=t.flags||{}; S.stageIndex=t.stageIndex||0; S.income=t.income||0; S.rentPerStage=t.rentPerStage||0; S.kidsCost=t.kidsCost||0;
      S.done=t.done||{}; S.log=t.log||[]; S._stageChoices=t.stageChoices||[]; S.people=t.people||[]; S._nameCache=t._nameCache||{}; S._parentsGone=t._parentsGone||false; S.dead=!!t.dead; S._reflection=t.reflection||''; }
    S.age=STAGES[S.stageIndex].startAge;
    if(typeof syncPeople==='function') syncPeople(S);
    if(typeof setBackground==='function') setBackground(STAGES[S.stageIndex]);
    S._consStage = (t.consStage===undefined||t.consStage===null) ? -1 : t.consStage;
    S._pendingCons = Array.isArray(t.pendingCons)?t.pendingCons:[]; S._ex = t.ex||''; S._chapStart = t.chapStart||null;
    try{ _setUrl(); }catch(e){}
    if((t.stepIndex||0)>0 && !t.finished){ S.stepIndex=t.stepIndex; if(typeof renderStep==='function'){ renderStep(); return; } }
    if(typeof renderStageIntro==='function') renderStageIntro();
  },
  saveTeam(){
    if(!this.active||!this.teamId) return;
    const prev=this._saved()||{};
    const t={ id:this.teamId, code:prev.code||this._code()||'', name:S.name, gender:S.gender, stageIndex:S.stageIndex,
      money:S.money, health:S.health, energy:S.energy, mind:S.mind, social:S.social,
      income:S.income, rentPerStage:S.rentPerStage, kidsCost:S.kidsCost,
      flags:S.flags, done:S.done, log:S.log, stageChoices:S._stageChoices, people:S.people,
      _nameCache:S._nameCache, _parentsGone:S._parentsGone, dead:S.dead,
      reflection: S._reflection||'',
      stepIndex: S.stepIndex||0, consStage: (S._consStage===undefined?-1:S._consStage),
      pendingCons: S._pendingCons||[], ex: S._ex||'', chapStart: S._chapStart||null,
      finished: !!this._finished };
    this.cache.teams[t.id]=t;
    try{ localStorage.setItem('ttl_solo', JSON.stringify(t)); }catch(e){}
  },
  markFinished(){ this._finished=true; this.saveTeam();
    // burn the ticket: active -> used, then forget the code (the report stays on screen)
    const code=this._code();
    if(code && !this._burned){ this._burned=true; CODES.finish(code).then(ok=>{ if(ok){ try{ localStorage.removeItem('ttl_solo_code'); }catch(e){} } }); }
    try{
      const id=this.teamId;
      const card=document.createElement('div');
      card.style.cssText='max-width:640px;margin:18px auto 0;background:var(--card-strong);border:1px solid var(--stroke);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow-soft)';
      card.innerHTML=`<div style="font-weight:900;font-size:15px;margin-bottom:4px">✍️ One last question</div>
        <div style="font-size:13px;color:var(--ink-soft);margin-bottom:10px">If you lived this life again — what would you do differently?</div>
        <textarea id="reflIn" maxlength="400" rows="3" style="width:100%;border:1px solid var(--stroke);border-radius:12px;padding:10px 12px;font-family:inherit;font-size:14px;color:var(--ink);background:#fff;resize:vertical">${(S._reflection||'').replace(/</g,'&lt;')}</textarea>

      this.app().appendChild(bar);
      document.getElementById('mpDlMine').onclick=()=>{ this.snd(); this.downloadTeam(id); };
      document.getElementById('mpPrint').onclick=()=>{ this.snd(); try{ window.print(); }catch(e){} };
    }catch(e){}
  },
};

/* URL: #code / #setup / #solo-chapter-N-… */
_setUrl=function(){ try{
  let hash='code';

  const want=location.pathname+qs+'#'+hash;
  if(location.pathname+location.search+location.hash!==want) history.replaceState(null,'',want);

})();

MP.init();

   REPORTS
   ============================================================ */
function _mpScore(t){
  const pillars=[t.health,t.energy,t.mind,t.social], avg=pillars.reduce((a,b)=>a+b,0)/4;
  const variance=pillars.reduce((a,b)=>a+Math.abs(b-avg),0)/4;
  const balance=Math.max(0,Math.round(100-variance*1.6));
  const wealthScore=Math.max(0,Math.min(100,Math.round(t.money/500)));
  const lifeScore=Math.round(avg*0.55+balance*0.25+wealthScore*0.20);
  let arch={title:'In progress',desc:'This team has not finished yet.'};
  if(typeof archetype==='function') arch=archetype({dead:t.dead,balance,wealth:t.money,h:t.health,en:t.energy,mn:t.mind,so:t.social,married:t.flags&&t.flags.married,kids:t.flags&&t.flags.kids,legacy:t.flags&&t.flags.legacy});
  return {balance,lifeScore,arch};
}
function _mpRow(label,val,color){ return `<td style="padding:6px 10px;border:1px solid #e3dcf2;color:${color||'#2b2550'};font-weight:700">${val}</td>`; }
function _stageReflect(i, e, prev){
  const end=e.end||{};
  const base={money:500,health:100,energy:70,mind:20,social:50};
  const ref = prev || (i===0?base:{});
  const pillars=[['health','health','❤️'],['energy','energy','⚡'],['mind','intelligence','🧠'],['social','relationships','🤝']];
  const deltas=pillars.map(p=>({label:p[1],em:p[2],d:(end[p[0]]||0)-(ref[p[0]]!==undefined?ref[p[0]]:0)}));
  const up=deltas.slice().sort((a,b)=>b.d-a.d)[0];
  const down=deltas.slice().sort((a,b)=>a.d-b.d)[0];
  const moneyD=(end.money||0)-(ref.money!==undefined?ref.money:0);
  const choices=(e.choices||[]).filter(Boolean);
  let line='';
  if(choices.length) line+=`Your team chose ${choices.slice(0,4).map(c=>'<b>'+c+'</b>').join(', ')}. `;
  else line+='No choices were recorded this chapter. ';
  if(up && up.d>0) line+=`That grew your ${up.em} <b>${up.label}</b> most (+${up.d}). `;
  if(down && down.d<0) line+=`The trade-off landed on ${down.em} <b>${down.label}</b> (${down.d}). `;
  if(moneyD>0) line+=`Net worth rose by $${moneyD.toLocaleString()}. `;
  else if(moneyD<0) line+=`It set you back $${Math.abs(moneyD).toLocaleString()}. `;
  return line.trim();
}
function _closingReflect(t){
  const pillars=[['health',t.health,'health','❤️'],['energy',t.energy,'energy','⚡'],['mind',t.mind,'intelligence','🧠'],['social',t.social,'relationships','🤝']];
  const top=pillars.slice().sort((a,b)=>b[1]-a[1])[0];
  const low=pillars.slice().sort((a,b)=>a[1]-b[1])[0];
  const money = t.money>=80000?'You built real financial security.':t.money<10000?'Money stayed tight right to the end.':'You reached a modest financial cushion.';
  return `Over a lifetime, your team protected ${top[3]} <b>${top[2]}</b> most (${top[1]}/100), while ${low[3]} <b>${low[2]}</b> got the least room to grow (${low[1]}/100). ${money} The real question isn't the score — it's whether this is the balance you'd choose to live again.`;
}
function _mpTeamSection(t){
  const sc=_mpScore(t);
  const fa = t.dead ? '—' : 75;
  let prev=null;
  const journey=(t.log||[]).map((e,i)=>{ const st=STAGES[i]; if(!st) return '';
    const html=`<div style="margin-bottom:13px;padding:12px 15px;background:#fff;border:1px solid #e3dcf2;border-left:4px solid #7b5cff;border-radius:11px">
      <div style="font-weight:800;font-size:14px;color:#3a3170">${st.emoji} ${st.name} <span style="font-weight:600;color:#8e88ad;font-size:12px">· Age ${st.age}</span></div>
      <div style="font-size:13px;color:#4a4470;line-height:1.6;margin-top:5px">${_stageReflect(i,e,prev)}</div></div>`;
    prev=e.end||prev; return html; }).join('');
  const cell='padding:8px 6px;border:1px solid #e3dcf2;text-align:center';
  return `<div style="margin:0 0 38px">
    <h2 style="color:#7b5cff;margin:0 0 4px">${t.gender==='f'?'👩':'👨'} ${_esc(t.name)}</h2>
    <div style="color:#5d5685;margin-bottom:12px">Outcome: <b>${sc.arch.title}</b>${t.finished?'':' · (life still in progress)'}</div>
    <table style="border-collapse:collapse;width:100%;font-size:12.5px;margin-bottom:18px">
      <tr style="background:#f3eeff">
        <th style="${cell}">Life Score</th><th style="${cell}">Balance</th><th style="${cell}">Net Worth</th><th style="${cell}">Final Age</th>
        <th style="${cell}">❤️ Health</th><th style="${cell}">⚡ Energy</th><th style="${cell}">🧠 Intelligence</th><th style="${cell}">🤝 Social</th></tr>
      <tr style="font-weight:800">
        <td style="${cell}">${sc.lifeScore}/100</td><td style="${cell}">${sc.balance}/100</td><td style="${cell};color:#b8860b">$${(t.money||0).toLocaleString()}</td><td style="${cell}">${fa}</td>
        <td style="${cell}">${t.health}</td><td style="${cell}">${t.energy}</td><td style="${cell}">${t.mind}</td><td style="${cell}">${t.social}</td></tr>
    </table>
    <h3 style="color:#16a085;font-size:14px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.5px">Your journey, chapter by chapter</h3>
    ${journey||'<p style="color:#8e88ad">No chapters completed yet.</p>'}
    <div style="margin-top:14px;padding:14px 16px;background:linear-gradient(135deg,#f3eeff,#eafaf5);border:1px solid #e3dcf2;border-radius:12px">
      <b style="color:#7b5cff">Closing reflection</b>
      <div style="font-size:13px;color:#4a4470;line-height:1.6;margin-top:5px">${_closingReflect(t)}</div></div>
    ${t.reflection?`<div style="margin-top:12px;padding:14px 16px;background:#fff;border:1px solid #e3dcf2;border-left:4px solid #16c2a3;border-radius:12px">
      <b style="color:#0a8f76">✍️ In their own words — what they'd do differently</b>
      <div style="font-size:13px;color:#4a4470;line-height:1.6;margin-top:5px;font-style:italic">“${String(t.reflection).replace(/</g,'&lt;')}”</div></div>`:''}
  </div>`;
}
function _mpDoc(title, body){
  return `<!DOCTYPE html><html><head><meta name="robots" content="noindex"><meta charset="utf-8"><title>${title}</title></head>
  <body style="font-family:Segoe UI,system-ui,sans-serif;color:#2b2550;max-width:900px;margin:0 auto;padding:30px 24px;background:#faf8ff">
  <h1 style="background:linear-gradient(90deg,#f5a623,#7b5cff,#16c2a3);-webkit-background-clip:text;background-clip:text;color:transparent">🎟️ ${title}</h1>
  <p style="color:#8e88ad;font-size:13px;margin-top:-8px">Ticket to Life — Classroom Edition · generated ${new Date().toLocaleString()}</p>
  <hr style="border:none;border-top:1px solid #e3dcf2;margin:14px 0 22px">${body}
  <p style="color:#a9a3c4;font-size:12px;margin-top:30px">Tip: open this file and use your browser's Print → Save as PDF.</p></body></html>`;
}
function _mpDownload(name, html){ try{
  const blob=new Blob([html],{type:'text/html'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}catch(e){ alert('Could not download in this browser.'); } }

MP.downloadTeam=function(id){ const t=this.readTeam(id); if(!t) return;
  _mpDownload(`ticket-to-life_${t.name.replace(/[^\w]+/g,'-')}.html`, _mpDoc(`${t.name} — Life Report`, _mpTeamSection(t))); };
MP.downloadCompiled=function(){ const teams=this.allTeams();
  if(!teams.length){ alert('No teams to report on yet.'); return; }
  const ranked=teams.map(t=>({t,s:_mpScore(t)})).sort((a,b)=>b.s.lifeScore-a.s.lifeScore);
  const comp=`<table style="border-collapse:collapse;width:100%;font-size:13px;margin-bottom:26px">
    <tr style="background:#f3eeff"><th style="padding:7px 10px;border:1px solid #e3dcf2;text-align:left">#</th><th style="padding:7px 10px;border:1px solid #e3dcf2;text-align:left">Team</th><th style="padding:7px 10px;border:1px solid #e3dcf2">Life Score</th><th style="padding:7px 10px;border:1px solid #e3dcf2">💰</th><th style="padding:7px 10px;border:1px solid #e3dcf2">❤️</th><th style="padding:7px 10px;border:1px solid #e3dcf2">⚡</th><th style="padding:7px 10px;border:1px solid #e3dcf2">🧠</th><th style="padding:7px 10px;border:1px solid #e3dcf2">🤝</th><th style="padding:7px 10px;border:1px solid #e3dcf2;text-align:left">Outcome</th></tr>
    ${ranked.map((r,i)=>`<tr><td style="padding:6px 10px;border:1px solid #e3dcf2;font-weight:800">${i+1}</td><td style="padding:6px 10px;border:1px solid #e3dcf2;font-weight:700">${_esc(r.t.name)}</td><td style="padding:6px 10px;border:1px solid #e3dcf2;text-align:center;font-weight:800">${r.s.lifeScore}</td><td style="padding:6px 10px;border:1px solid #e3dcf2;text-align:center">$${(r.t.money||0).toLocaleString()}</td><td style="padding:6px 10px;border:1px solid #e3dcf2;text-align:center">${r.t.health}</td><td style="padding:6px 10px;border:1px solid #e3dcf2;text-align:center">${r.t.energy}</td><td style="padding:6px 10px;border:1px solid #e3dcf2;text-align:center">${r.t.mind}</td><td style="padding:6px 10px;border:1px solid #e3dcf2;text-align:center">${r.t.social}</td><td style="padding:6px 10px;border:1px solid #e3dcf2;font-size:12px">${r.s.arch.title}</td></tr>`).join('')}
  </table>`;
  const body=`<h2 style="color:#16c2a3">Class Leaderboard</h2>${comp}<h2 style="color:#7b5cff">Every Team — Reflective Reports</h2>${ranked.map(r=>_mpTeamSection(r.t)).join('')}`;
  _mpDownload('ticket-to-life_compiled-report.html', _mpDoc('Compiled Class Report', body)); };

MP.downloadCSV=function(){
  const teams=this.allTeams();
  if(!teams.length){ alert('No teams to export yet.'); return; }
  const esc=v=>{ v=(v==null?'':String(v)).replace(/"/g,'""'); return /[",\n]/.test(v)?'"'+v+'"':v; };
  const head=['Team','Status','Chapter','Money','Health','Energy','Intelligence','Social','Life Score','Balance','Outcome','Would do differently'];
  const rows=teams.map(t=>{ const sc=_mpScore(t);
    return [t.name, t.finished?'Finished':'In progress', (t.stageIndex||0)+1, t.money||0, t.health, t.energy, t.mind, t.social, sc.lifeScore, sc.balance, sc.arch.title, t.reflection||''].map(esc).join(','); });
  const csv=head.join(',')+'\n'+rows.join('\n');
  try{
    const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='ticket-to-life_class.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  }catch(e){ alert('Could not download in this browser.'); }
};
