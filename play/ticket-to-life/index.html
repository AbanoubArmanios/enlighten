<!DOCTYPE html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ticket to Life — Solo</title>
<style>
  :root{
    --ink:#2b2550; --ink-soft:#5d5685; --ink-dim:#8e88ad;
    --card:rgba(255,255,255,.74); --card-strong:rgba(255,255,255,.92);
    --stroke:rgba(90,60,150,.16); --stroke-strong:rgba(90,60,150,.28);
    --money:#f5a623; --health:#ff5d7e; --energy:#16c2a3; --mind:#5b8def; --social:#b06bf0;
    --good:#16c2a3; --bad:#ff5d7e;
    --shadow:0 14px 40px rgba(80,50,140,.18);
    --shadow-soft:0 6px 20px rgba(80,50,140,.12);
    --r:22px;
    --bg-a:#a8edea; --bg-b:#fed6e3; --bg-c:#fbc2eb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 600px at 8% -5%, var(--bg-a) 0%, transparent 55%),
      radial-gradient(900px 650px at 105% 8%, var(--bg-c) 0%, transparent 52%),
      radial-gradient(1000px 800px at 50% 115%, var(--bg-b) 0%, transparent 55%),
      linear-gradient(150deg, #fef6ff 0%, #eef3ff 45%, #f3fff8 100%);
    background-attachment:fixed;
    min-height:100%; overflow-x:hidden;
    transition:background 1s ease;
  }
  .bokeh{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .bokeh i{position:absolute;border-radius:50%;filter:blur(2px);opacity:.5;animation:drift linear infinite}
  @keyframes drift{0%{transform:translateY(20px) scale(.8)}50%{transform:translateY(-30px) scale(1.1)}100%{transform:translateY(20px) scale(.8)}}
  #app{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:18px 18px 70px}

  /* ---------- buttons ---------- */
  .btn{font-family:inherit;cursor:pointer;border:none;border-radius:16px;font-weight:800;letter-spacing:.3px;transition:transform .15s,box-shadow .15s,filter .15s}
  .btn:active{transform:scale(.97)}
  .btn-go{padding:15px 32px;font-size:16px;color:#fff;background:linear-gradient(90deg,#7b5cff,#b06bf0,#ff7eb3);box-shadow:0 12px 28px rgba(140,90,240,.4)}
  .btn-go:hover{filter:brightness(1.06);box-shadow:0 16px 36px rgba(140,90,240,.55)}
  .btn-ghost{padding:12px 22px;background:var(--card-strong);color:var(--ink);border:1px solid var(--stroke)}
  .btn-ghost:hover{background:#fff}

  /* ---------- HUD ---------- */
  .hud{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.6));
    backdrop-filter:blur(14px);border:1px solid var(--stroke);border-radius:var(--r);padding:13px 16px;margin-bottom:16px;box-shadow:var(--shadow-soft)}
  .hud-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .stage-badge{display:flex;align-items:center;gap:10px}
  .stage-badge .em{font-size:26px}
  .stage-badge h2{font-size:15px;font-weight:800}
  .stage-badge p{font-size:12px;color:var(--ink-soft)}
  .age-pill{font-size:12px;color:var(--ink-soft);background:var(--card);border:1px solid var(--stroke);padding:6px 12px;border-radius:999px;font-weight:700}
  .time-wrap{text-align:right}
  .time-wrap .lbl{font-size:10px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:1px;font-weight:700}
  .time-wrap .val{font-size:19px;font-weight:900;color:var(--energy)}
  .time-bar{height:5px;border-radius:4px;background:rgba(90,60,150,.12);margin-top:4px;width:120px;overflow:hidden}
  .time-bar i{display:block;height:100%;background:linear-gradient(90deg,#16c2a3,#5b8def);transition:width .5s cubic-bezier(.2,.8,.2,1)}

  /* ---------- scene: avatar + guide ---------- */
  .scene{display:grid;grid-template-columns:300px 1fr;gap:16px;margin-bottom:16px}
  .avatar-card{background:var(--card);border:1px solid var(--stroke);border-radius:var(--r);padding:16px;text-align:center;box-shadow:var(--shadow-soft);position:relative;overflow:hidden}
  .avatar-card svg{display:block;margin:0 auto;width:170px;height:auto;filter:drop-shadow(0 8px 14px rgba(80,50,140,.18))}
  .avatar-name{font-size:18px;font-weight:900;margin-top:6px}
  .avatar-state{font-size:12px;color:var(--ink-soft);margin-top:2px;font-weight:700;letter-spacing:.3px}
  .wellbeing{margin-top:10px;font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:1px;font-weight:700}
  .wellbeing .wb-bar{height:8px;border-radius:6px;background:rgba(90,60,150,.12);margin-top:4px;overflow:hidden}
  .wellbeing .wb-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#ff7eb3,#7b5cff,#16c2a3);transition:width .6s}

  .guide-card{background:var(--card);border:1px solid var(--stroke);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow-soft);display:flex;flex-direction:column}
  .guide-row{display:flex;gap:14px;align-items:flex-start}
  .guide-sprite{flex:0 0 auto;width:88px;height:88px;animation:bob 3s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .bubble{position:relative;background:var(--card-strong);border:1px solid var(--stroke);border-radius:16px;padding:13px 16px;flex:1;min-height:64px;box-shadow:var(--shadow-soft)}
  .bubble::before{content:"";position:absolute;left:-9px;top:22px;width:16px;height:16px;background:var(--card-strong);border-left:1px solid var(--stroke);border-bottom:1px solid var(--stroke);transform:rotate(45deg)}
  .bubble .who{font-size:11px;font-weight:900;color:var(--social);letter-spacing:.5px;text-transform:uppercase;margin-bottom:3px}
  .bubble .say{font-size:14px;line-height:1.5;color:var(--ink)}

  /* people strip */
  .people{margin-top:14px}
  .people-h{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-dim);font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .people-row{display:flex;gap:10px;flex-wrap:wrap}
  .person{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;animation:pop .5s}
  .person .disc{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;border:2px solid #fff;box-shadow:var(--shadow-soft)}
  .person .pn{font-size:11px;font-weight:800;color:var(--ink)}
  .person .pr{font-size:9.5px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.3px}
  .person.leaving{animation:leave .6s forwards}
  @keyframes leave{to{opacity:0;transform:scale(.5) translateY(10px)}}
  .people-empty{font-size:12px;color:var(--ink-dim)}

  /* ---------- KPI mascots ---------- */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--stroke);border-radius:16px;padding:11px 10px;text-align:center;box-shadow:var(--shadow-soft);position:relative}
  .kpi svg{width:38px;height:38px;display:block;margin:0 auto 4px}
  .kpi .kicon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 5px;border:2px solid;box-shadow:var(--shadow-soft)}
  .kpi .kn{font-size:10.5px;color:var(--ink-soft);font-weight:800;text-transform:uppercase;letter-spacing:.5px}
  .kpi .kv{font-size:15px;font-weight:900;margin-top:1px}
  .kpi .kbar{height:6px;border-radius:5px;background:rgba(90,60,150,.12);margin-top:6px;overflow:hidden}
  .kpi .kbar i{display:block;height:100%;border-radius:5px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .kpi.flash-good{animation:fg .7s}.kpi.flash-bad{animation:fb .7s}
  @keyframes fg{0%{box-shadow:0 0 0 0 rgba(22,194,163,0)}30%{box-shadow:0 0 0 4px rgba(22,194,163,.4)}100%{box-shadow:0 0 0 0 rgba(22,194,163,0)}}
  @keyframes fb{0%{box-shadow:0 0 0 0 rgba(255,93,126,0)}30%{box-shadow:0 0 0 4px rgba(255,93,126,.45)}100%{box-shadow:0 0 0 0 rgba(255,93,126,0)}}

  /* ---------- stage intro + cards ---------- */
  .stage-intro{background:var(--card);border:1px solid var(--stroke);border-radius:var(--r);padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow-soft);animation:rise .5s}
  .stage-intro h3{font-size:18px;margin-bottom:6px}
  .stage-intro p{color:var(--ink-soft);font-size:14px;line-height:1.55}
  .cat{margin-bottom:18px}
  .cat-h{font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-dim);font-weight:800;margin:0 0 10px 4px;display:flex;align-items:center;gap:8px}
  .cat-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--stroke-strong),transparent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .card{position:relative;background:var(--card-strong);border:1px solid var(--stroke);border-radius:18px;padding:15px;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s;overflow:hidden;box-shadow:var(--shadow-soft)}
  .card::before{content:"";position:absolute;inset:0;background:radial-gradient(360px 180px at var(--mx,50%) var(--my,0%),rgba(176,107,240,.12),transparent 60%);opacity:0;transition:opacity .25s}
  .card:hover{transform:translateY(-4px);border-color:var(--social);box-shadow:0 16px 34px rgba(140,90,240,.22)}
  .card:hover::before{opacity:1}
  .card .ttl{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;margin-bottom:6px}
  .card .ttl .em{font-size:21px}
  .card .ds{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin-bottom:11px;min-height:34px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:9px;border:1px solid transparent}
  .chip.pos{color:#0a8f76;background:rgba(22,194,163,.15)}
  .chip.neg{color:#d63a5c;background:rgba(255,93,126,.14)}
  .chip.time{color:#3a63c0;background:rgba(91,141,239,.14)}
  .chip.unlock{color:#a85a00;background:rgba(245,166,35,.18)}
  .badge-once{position:absolute;top:10px;right:10px;font-size:9px;letter-spacing:1px;color:var(--ink-dim);text-transform:uppercase;border:1px solid var(--stroke);padding:2px 6px;border-radius:6px;font-weight:800}
  .card.locked{cursor:not-allowed;opacity:.62}
  .card.locked:hover{transform:none;border-color:var(--stroke);box-shadow:var(--shadow-soft)}
  .lock-note{margin-top:10px;font-size:11.5px;color:#c25b00;display:flex;gap:6px;align-items:flex-start;font-weight:700}
  .card.done{cursor:default;border-color:rgba(22,194,163,.5);background:rgba(22,194,163,.08)}
  .card.done:hover{transform:none;box-shadow:var(--shadow-soft)}
  .done-tag{position:absolute;top:10px;right:10px;font-size:11px;color:var(--good);font-weight:900}
  .card.picked{animation:pick .5s}
  @keyframes pick{0%{transform:scale(1)}40%{transform:scale(.96)}100%{transform:scale(1)}}

  .advance{position:sticky;bottom:14px;z-index:25;margin-top:8px;display:flex;justify-content:center}

  /* float indicators */
  .float{position:fixed;z-index:60;font-weight:900;font-size:15px;pointer-events:none;text-shadow:0 1px 6px rgba(255,255,255,.9);animation:flo 1.1s forwards ease-out}
  @keyframes flo{0%{opacity:0;transform:translateY(8px) scale(.8)}15%{opacity:1}100%{opacity:0;transform:translateY(-46px) scale(1.05)}}

  /* modal */
  .overlay{position:fixed;inset:0;z-index:80;background:rgba(60,40,110,.34);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .35s}
  .modal{max-width:560px;width:100%;background:linear-gradient(160deg,#ffffff,#f4f0ff);border:1px solid var(--stroke);border-radius:26px;padding:28px;box-shadow:var(--shadow);animation:rise .45s}
  .modal .em-big{font-size:50px;text-align:center;margin-bottom:8px;animation:pop .5s}
  .modal h3{font-size:22px;text-align:center;margin-bottom:10px}
  .modal p{color:var(--ink-soft);font-size:14.5px;line-height:1.6;text-align:center;margin-bottom:20px}
  .modal .opts{display:flex;flex-direction:column;gap:10px}
  .opt{text-align:left;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--stroke);cursor:pointer;transition:transform .15s,border-color .15s,background .15s}
  .opt:hover{transform:translateX(3px);border-color:var(--social);background:#fff}
  .opt .ot{font-weight:800;font-size:14.5px;margin-bottom:3px}
  .opt .oc{font-size:12px;color:var(--ink-soft)}

  /* setup / hero */
  .hero{text-align:center;padding:40px 20px 20px;animation:rise .6s}
  .hero .ticket{font-size:62px;animation:floaty 4s ease-in-out infinite;display:inline-block}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}
  .hero h1{font-size:42px;font-weight:900;letter-spacing:-.5px;margin:8px 0 6px;background:linear-gradient(90deg,#f5a623,#ff7eb3,#7b5cff,#16c2a3);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero .sub{color:var(--ink-soft);font-size:16px;max-width:560px;margin:0 auto 6px;line-height:1.6}
  .hero .tag{color:var(--ink-dim);font-size:13px;margin-bottom:22px;font-weight:600}
  .setup{max-width:520px;margin:8px auto 0;background:var(--card);border:1px solid var(--stroke);border-radius:var(--r);padding:24px;text-align:left;box-shadow:var(--shadow-soft)}
  .setup label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--ink-dim);display:block;margin-bottom:8px}
  .setup input{width:100%;padding:13px 15px;border-radius:14px;border:1px solid var(--stroke);background:#fff;font-size:16px;font-family:inherit;color:var(--ink);margin-bottom:18px;font-weight:600}
  .setup input:focus{outline:none;border-color:var(--social);box-shadow:0 0 0 3px rgba(176,107,240,.18)}
  .gender-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:22px}
  .gopt{padding:14px 8px;border-radius:14px;border:1px solid var(--stroke);background:#fff;cursor:pointer;text-align:center;transition:.15s;font-weight:800;font-size:13px;color:var(--ink-soft)}
  .gopt .ge{font-size:26px;display:block;margin-bottom:4px}
  .gopt:hover{border-color:var(--social)}
  .gopt.sel{border-color:var(--social);background:linear-gradient(135deg,rgba(176,107,240,.16),rgba(123,92,255,.12));color:var(--ink);box-shadow:0 0 0 2px rgba(176,107,240,.2)}
  .setup-err{color:#d63a5c;font-size:13px;font-weight:800;margin:-6px 0 14px;min-height:17px;text-align:center}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
  .shake{animation:shake .4s}
  .legend{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:18px auto;max-width:640px}
  .leg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);background:var(--card);border:1px solid var(--stroke);padding:7px 12px;border-radius:11px;font-weight:600}

  .sound-toggle{position:fixed;top:16px;right:16px;z-index:90;width:42px;height:42px;border-radius:12px;background:var(--card-strong);border:1px solid var(--stroke);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);box-shadow:var(--shadow-soft)}
  .sound-toggle:hover{background:#fff}

  /* end screen */
  .end-archetype{text-align:center;padding:14px 0}
  .end-archetype svg{width:150px;height:auto;margin:0 auto;display:block;filter:drop-shadow(0 8px 14px rgba(80,50,140,.2))}
  .end-archetype h2{font-size:30px;font-weight:900;margin:6px 0 6px;background:linear-gradient(90deg,#f5a623,#7b5cff,#16c2a3);-webkit-background-clip:text;background-clip:text;color:transparent}
  .end-archetype .desc{color:var(--ink-soft);max-width:560px;margin:0 auto;font-size:15px;line-height:1.6}
  .end-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:20px 0}
  .es{background:var(--card);border:1px solid var(--stroke);border-radius:16px;padding:15px;text-align:center;box-shadow:var(--shadow-soft)}
  .es .v{font-size:23px;font-weight:900}
  .es .l{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:1px;margin-top:3px;font-weight:700}
  .reflect{background:var(--card);border:1px solid var(--stroke);border-radius:var(--r);padding:20px 22px;margin:14px 0;box-shadow:var(--shadow-soft)}
  .reflect h3{font-size:16px;margin-bottom:14px;display:flex;gap:8px;align-items:center}
  .reflect .q{margin-bottom:14px}
  .reflect .q .qq{font-size:14px;font-weight:800;margin-bottom:4px}
  .reflect .q .qa{font-size:13.5px;color:var(--ink-soft);line-height:1.55}
  .timeline .tl-item{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid rgba(90,60,150,.08)}
  .tl-item .tl-stage{font-size:11px;color:var(--ink-dim);min-width:130px;padding-top:2px;font-weight:700}
  .tl-item .tl-choices{font-size:13px;color:var(--ink-soft);line-height:1.5}

  @keyframes rise{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes fade{0%{opacity:0}100%{opacity:1}}
  @keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
  @media(max-width:760px){.scene{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:480px){.hero h1{font-size:32px}.gender-opts{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="bokeh" id="bokeh"></div>
<button class="sound-toggle" id="soundBtn" title="Toggle sound">🔊</button>
<div id="app"></div>
<script>
/* ============================================================
   TICKET TO LIFE — Reflective Edition
   Step-by-step life simulation. Data-driven wizard engine.
   ============================================================ */

/* ---------- Audio (Web Audio, no files) ---------- */
const Sound = (()=>{
  let ctx=null,on=true;
  function ac(){ if(!ctx){ try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return ctx; }
  function tone(f,d,t,v,delay,slide){ if(!on)return; const c=ac(); if(!c)return;
    const tm=c.currentTime+(delay||0), o=c.createOscillator(), g=c.createGain();
    o.type=t||'sine'; o.frequency.setValueAtTime(f,tm);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,tm+d);
    g.gain.setValueAtTime(0,tm); g.gain.linearRampToValueAtTime(v||.12,tm+.012);
    g.gain.exponentialRampToValueAtTime(.0001,tm+d);
    o.connect(g); g.connect(c.destination); o.start(tm); o.stop(tm+d+.02); }
  return {
    setOn(v){on=v; if(on)tone(660,.08,'sine',.1);}, isOn(){return on;},
    click(){tone(440,.06,'triangle',.08);}, hover(){tone(760,.03,'sine',.025);},
    good(){tone(523,.1,'sine',.1);tone(784,.14,'sine',.09,.08);},
    great(){tone(523,.1,'sine',.1);tone(659,.1,'sine',.1,.08);tone(988,.2,'sine',.1,.16);},
    bad(){tone(220,.18,'sawtooth',.06,0,120);},
    unlock(){tone(660,.09,'triangle',.1);tone(880,.09,'triangle',.1,.08);tone(1175,.22,'triangle',.1,.16);},
    join(){tone(523,.08,'sine',.09);tone(880,.16,'sine',.09,.08);},
    leave(){tone(440,.14,'sine',.07,0,260);},
    step(){tone(620,.05,'sine',.05);},
    advance(){tone(200,.5,'sine',.09,0,560);tone(400,.4,'sine',.05,.05);},
    event(){tone(880,.08,'square',.06);tone(660,.12,'square',.05,.09);},
    start(){[392,523,659,784].forEach((f,i)=>tone(f,.18,'sine',.1,i*.1));},
    end(){[523,587,659,784,880].forEach((f,i)=>tone(f,.35,'sine',.1,i*.16));},
    death(){[330,294,262,196].forEach((f,i)=>tone(f,.45,'sine',.1,i*.22));}
  };
})();

/* ---------- Stat meta ---------- */
const STAT = {
  money:{e:'💰',n:'Money',c:'var(--money)'},
  health:{e:'❤️',n:'Health',c:'var(--health)'},
  energy:{e:'⚡',n:'Energy',c:'var(--energy)'},
  mind:{e:'🧠',n:'Mind',c:'var(--mind)'},
  social:{e:'🤝',n:'Social',c:'var(--social)'}
};

/* ---------- State ---------- */
let S;
function freshState(){
  return {
    name:'You', gender:'o',
    age:18, stageIndex:0, stepIndex:0,
    money:500, health:100, energy:70, mind:20, social:50,
    income:0, rentPerStage:0, kidsCost:0,
    flags:{}, done:{},
    people:[], _nameCache:{}, _parentsGone:false,
    log:[], _stageChoices:[],
    dead:false, deathReason:'',
    tutorialDone:false
  };
}
function need(c,r){ return c?null:r; }
function clampStats(){
  ['health','energy','mind','social'].forEach(k=>{ S[k]=Math.max(0,Math.min(100,Math.round(S[k]))); });
  S.money=Math.round(S.money);
}

/* ============================================================
   STAGES — each stage is a sequence of decision STEPS.
   step.kind: 'mandatory' (must pick one) | 'optional' (may skip)

function computeLook(s){
  const ab=['young','young','adult','established','mature','senior','elder'][s.stageIndex]||'elder';
  let phys='normal';
  if(s.flags.junkHabit && s.health<55) phys='heavy';
  else if(s.flags.fitHabit && s.health>=65) phys='fit';
  else if(s.health<40 || s.energy<30) phys='frail';
  const wb=(s.health+s.energy+s.social)/3 + (s.money>=5000?8:0);
  const mood = wb>=66?'happy': wb>=42?'neutral':'sad';
  const wealth = s.money<2000?'low': s.money<15000?'mid':'rich';
  return {ab,phys,mood,wealth,gender:s.gender,stage:s.stageIndex};
}

function drawPlayer(s){
  const L=computeLook(s);
  const cx=110, cy=96;
  const rx = L.phys==='heavy'?50 : L.phys==='frail'?37 : 43;
  const ry = L.phys==='heavy'?47 : L.phys==='frail'?41 : 44;
  const sh = L.phys==='fit'?84 : L.phys==='heavy'?94 : L.phys==='frail'?56 : 70;
  const skin='#f3c79b';
  const hairCol = {young:'#4a3526',adult:'#4a3526',established:'#473122',mature:'#7a6a55',senior:'#a7a7a7',elder:'#e4e4e4'}[L.ab];
  const moodAura = L.mood==='happy'?'#7ef5d0':L.mood==='neutral'?'#bcd2ff':'#e0cdee';
  const outfit = L.wealth==='low'?'#9aa3b8':L.wealth==='mid'?'#5b8def':'#7b5cff';
  const outfit2 = L.wealth==='low'?'#828ba5':L.wealth==='mid'?'#4a78e0':'#6a48c8';

const NAMES={friend:['Alex','Sam','Jordan','Taylor','Riley','Casey','Jamie','Morgan'],
  kid:['Noah','Mia','Liam','Zoe','Eli','Ava','Leo','Ivy'],
  partner:['Jesse','Robin','Charlie','Sky','River','Dana'],
  colleague:['Pat','Dana','Chris'], mentee:['Nova','Wren','Sky']};
function pickName(s,key,pool){ if(!s._nameCache[key]){ const a=NAMES[pool]; let h=0; for(const c of key)h=(h*31+c.charCodeAt(0))>>>0; s._nameCache[key]=a[h%a.length]; } return s._nameCache[key]; }

function desiredPeople(s){
  const L=[];
  if(!s._parentsGone){ L.push({key:'mom',name:'Mom',rel:'Mother',emoji:'👩',hue:330});
    L.push({key:'dad',name:'Dad',rel:'Father',emoji:'👨',hue:212}); }
  const fc = s.social>=72?3 : s.social>=52?2 : s.social>=36?1:0;
  const fem=['🧑','🧒','👱','🧓'], hues=[150,42,278,200];
  for(let i=0;i<fc;i++){ const k='friend'+i; L.push({key:k,name:pickName(s,k,'friend'),rel:'Friend',emoji:fem[i%4],hue:hues[i%4]}); }
  if(s.flags.married){ L.push({key:'spouse',name:pickName(s,'spouse','partner'),rel:'Spouse',emoji:'🧑‍🤝‍🧑',hue:342}); }
  else if(s.flags.partner){ L.push({key:'partner',name:pickName(s,'partner','partner'),rel:'Partner',emoji:'💑',hue:342}); }
  if(s.flags.kids){ L.push({key:'kid0',name:pickName(s,'kid0','kid'),rel:'Child',emoji:'🧒',hue:50});
    if(s.stageIndex>=4) L.push({key:'kid1',name:pickName(s,'kid1','kid'),rel:'Child',emoji:'👦',hue:96}); }
  if(s.flags.networked||s.flags.senior||s.flags.exec||s.flags.promoted){ L.push({key:'colleague',name:pickName(s,'colleague','colleague'),rel:'Colleague',emoji:'🧑‍💼',hue:215}); }
  if(s.flags.mentor){ L.push({key:'mentee',name:pickName(s,'mentee','mentee'),rel:'Mentee',emoji:'🧑‍🎓',hue:266}); }
  return L;
}
function syncPeople(s){
  const want=desiredPeople(s), have=s.people||[];
  const wk=new Set(want.map(p=>p.key)), hk=new Set(have.map(p=>p.key));
  const added=want.filter(p=>!hk.has(p.key)), removed=have.filter(p=>!wk.has(p.key));
  s.people=want; return {added,removed};
}
function personHTML(p){
  return `<div class="person"><div class="disc" style="background:radial-gradient(circle at 35% 30%, hsl(${p.hue},90%,82%), hsl(${p.hue},70%,62%))">${p.emoji}</div>

}

function beginLife(nameArg,genderArg){

/* ---------- step screen ---------- */
function visibleSteps(){ return STAGES[S.stageIndex].steps.filter(st=>!st.show||st.show(S)); }
function renderStep(){
  const steps=visibleSteps();
  if(S.stepIndex>=steps.length){ renderStageSummary(); return; }
  const step=steps[S.stepIndex];
  const msg = S._flashGuide || step.guide; S._flashGuide=null;

  let cards='';
  step.choices.forEach(ch=>{
    if(ch.show && !ch.show(S)) return;
    const reason = ch.lock?ch.lock(S):null;
    cards += choiceCard(ch, reason);
  });
  const dots = steps.map((_,i)=>`<span style="width:9px;height:9px;border-radius:50%;display:inline-block;margin:0 3px;background:${i===S.stepIndex?'var(--social)':'rgba(90,60,150,.2)'}"></span>`).join('');
  const kindTag = step.kind==='mandatory'
    ? `<span class="chip" style="background:rgba(255,93,126,.14);color:#d63a5c">● Choose one to continue</span>`
    : `<span class="chip" style="background:rgba(22,194,163,.15);color:#0a8f76">○ Optional — you may skip</span>`;
  const skip = step.kind==='optional' ? `<div class="advance"><button class="btn btn-ghost" onclick="skipStep()">Skip this ▸</button></div>` : '';

  app.innerHTML = headerHTML(msg) + `
    <div class="stage-intro">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:4px">

    </div>

    ${skip}`;
  bindFX();
  window.scrollTo({top:0,behavior:'smooth'});
}
function choiceCard(ch, reason){
  const e=ch.effect||{}; let chips='';
  ['money','health','energy','mind','social'].forEach(k=>{ if(e[k]){ const pos=e[k]>0;
    const v=k==='money'?(pos?'+$':'-$')+Math.abs(e[k]).toLocaleString():(pos?'+':'')+e[k];
    chips+=`<span class="chip ${pos?'pos':'neg'}">${STAT[k].e} ${v}</span>`; }});
  if(ch.income) chips+=`<span class="chip unlock">💵 +$${ch.income.toLocaleString()}/chapter</span>`;
  if(ch.rent) chips+=`<span class="chip neg">🏠 -$${ch.rent}/chapter</span>`;
  if(ch.kids) chips+=`<span class="chip neg">👶 -$${ch.kids}/chapter</span>`;
  if(ch.persist) chips+=`<span class="chip unlock">🔓 ${OWNED[ch.persist]||'Unlock'}</span>`;
  if(ch.id==='dating' && S.flags.car) chips+=`<span class="chip unlock">🚗 Car bonus +🤝</span>`;
  if(reason){
    return `<div class="card locked"><div class="ttl"><span class="em">${ch.em}</span>${ch.t}</div>
      <div class="ds">${ch.d}</div><div class="chips">${chips}</div><div class="lock-note">🔒 ${reason}</div></div>`;
  }
  return `<div class="card" onclick="chooseStep('${ch.id}',this)"><div class="ttl"><span class="em">${ch.em}</span>${ch.t}</div>
    <div class="ds">${ch.d}</div><div class="chips">${chips}</div></div>`;
}
function bindFX(){
  document.querySelectorAll('.card:not(.locked)').forEach(c=>{
    c.addEventListener('mousemove',e=>{ const r=c.getBoundingClientRect();
      c.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');
      c.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%'); });
    c.addEventListener('mouseenter',()=>Sound.hover());
  });
}

function findStepChoice(id){ for(const st of visibleSteps()){ for(const ch of st.choices){ if(ch.id===id) return ch; } } return null; }

function chooseStep(id, el){
  const ch=findStepChoice(id); if(!ch) return;
  if(ch.lock && ch.lock(S)) return;
  Sound.click(); if(el) el.classList.add('picked');
  const e=ch.effect||{};
  const rect = el?el.getBoundingClientRect():{left:innerWidth/2,top:140,width:0};
  let net=0,fi=0;
  ['money','health','energy','mind','social'].forEach(k=>{ if(e[k]){ S[k]+=e[k]; net+=(k==='money'?e[k]/200:e[k]);
    floatIndicator(k,e[k],rect,fi++); flashKPI(k,e[k]>0); }});
  // dynamic: car helps dating
  if(ch.id==='dating' && S.flags.car){ S.social+=6; floatIndicator('social',6,rect,fi++); }
  if(ch.income) S.income=Math.max(S.income,ch.income);
  if(ch.rent!==undefined) S.rentPerStage=ch.rent;
  if(ch.kids) S.kidsCost+=ch.kids;
  if(ch.set) ch.set.forEach(f=>S.flags[f]=true);
  if(ch.special==='startup'){ const r=Math.random();
    if(r<0.4){S.money+=8000;S.income=Math.max(S.income,4000);S._flashGuide='🚀 Your startup took off — a big payday and strong income!';}
    else if(r<0.75){S.income=Math.max(S.income,1500);S._flashGuide='🚀 The startup survives — modest but real.';}
    else {S.money-=1000;S.income=Math.max(S.income,800);S._flashGuide='💥 The startup folded. Hard lessons, thin income.';}
  }
  S._stageChoices.push(ch.em+' '+ch.t);
  clampStats();

  // reactions & people
  const sync=syncPeople(S);
  let guideMsg=S._flashGuide;
  if(sync.added.length){ Sound.join(); const p=sync.added[0];
    guideMsg = p.rel==='Spouse'?`💍 You married ${p.name}! A new life partner joins your story.`
      : p.rel==='Partner'?`💞 ${p.name} is now part of your life.`
      : p.rel==='Child'?`👶 ${p.name} is born! Your family grows.`
      : `🎉 ${p.name} (${p.rel.toLowerCase()}) joins the people in your life.`;
  } else if(!guideMsg){ guideMsg=guideReact(ch,net); }
  S._flashGuide=guideMsg;

  if(ch.set && ch.set.includes('car')) Sound.unlock();
  else if(net>20) Sound.great(); else if(net>0) Sound.good(); else if(net<0) Sound.bad();

  if(S.health<=0){ S.dead=true; S.deathReason='Your health gave out. The body keeps the score.'; setTimeout(renderEnd,400); return; }
  S.stepIndex++;
  setTimeout(renderStep,240);
}
function skipStep(){ Sound.step(); S._flashGuide="No worries — not every door needs walking through."; S.stepIndex++; renderStep(); }

function guideReact(ch,net){
  const e=ch.effect||{};
  if(S.energy<28) return "⚠️ Your energy's running dangerously low — find a way to rest soon.";
  if(S.health<35) return "⚠️ Your health is fragile. One more hit could end the story early.";
  if(e.mind>=20) return "Sharper every day. A strong mind unlocks the best paths ahead. 🧠";
  if(e.money>=1000) return "Cha-ching — savings turn into real options later. 💰";
  if(e.health>=10) return "Smart. Health protected now pays off for decades. ❤️";
  if(e.health<=-10) return "Hmm, that chips away at your health. Keep an eye on it.";
  if(e.social>=15) return "Your circle's growing — that's wealth money can't buy. 🤝";
  const pool=["Good call. Onward!","Every choice writes the story. Next…","Noted. Let's keep going.","A very human decision. 👍"];
  return pool[Math.floor(Math.random()*pool.length)];
}

function floatIndicator(stat,val,rect,i){
  const f=document.createElement('div'); f.className='float';
  f.style.color=STAT[stat].c;
  f.style.left=(rect.left+rect.width/2-12)+'px'; f.style.top=(rect.top+10+i*22)+'px';
  const txt=stat==='money'?(val>0?'+$':'-$')+Math.abs(val).toLocaleString():(val>0?'+':'')+val;
  f.textContent=STAT[stat].e+' '+txt; document.body.appendChild(f); setTimeout(()=>f.remove(),1150);
}

/* ---------- stage summary ---------- */
function stageFeedback(){
  const f=[];
  if(S.health<35) f.push("your health is in the danger zone — protect it next chapter or the story could end early");
  else if(S.energy<30) f.push("you're running on fumes; build in recovery before burnout costs you");
  if(S.money<0) f.push("you're in the red — income has to come before the next big splurge");
  else if(S.money>=15000) f.push("your savings give you options most people simply don't have");
  if(S.mind>=70) f.push("your mind is sharp, and it's unlocking paths most never reach");
  else if(S.mind<35 && S.stageIndex<=2) f.push("your knowledge is lagging, and the best careers are gated behind it — invest while you can");
  if(S.social>=72) f.push("you're rich in people, and that support is quietly one of your biggest assets");
  else if(S.social<35) f.push("you're drifting solo; relationships are far harder to rebuild later than to keep now");
  if(!f.length) f.push("a balanced chapter — no crisis, no standout. Steady hands win long games");
  const lead={0:"University's behind you. ",1:"Your career is taking shape. ",2:"You're finding your footing. ",3:"These are the building years. ",4:"You're closing on your peak. ",5:"The wind-down begins. ",6:"The final chapter closes. "}[S.stageIndex]||"";
  const body=f.slice(0,2).map(x=>x.charAt(0).toUpperCase()+x.slice(1)).join('. ');
  return lead + body + '.';
}
function renderStageSummary(){
  const st=STAGES[S.stageIndex];
  const last = S.stageIndex===STAGES.length-1;
  const recap = S._stageChoices.length?S._stageChoices.map(c=>`<span class="leg">${c}</span>`).join(''):'<span class="people-empty">A quiet chapter.</span>';
  const fb=stageFeedback();
  S._flashGuide=null;
  app.innerHTML = headerHTML(last?"That's a whole life lived. Let's look back on it together. 🕊️":`Chapter ${S.stageIndex+1} complete. Here's my honest read on how it went.`) + `
    <div class="stage-intro">
      <h3>📖 Chapter ${S.stageIndex+1} Recap — ${st.name}</h3>
      <div style="display:flex;gap:12px;align-items:flex-start;background:linear-gradient(135deg,rgba(22,194,163,.1),rgba(123,92,255,.08));border:1px solid var(--stroke);border-radius:16px;padding:14px 16px;margin:6px 0 14px">
        <div style="flex:0 0 auto;width:52px">${guideSprite()}</div>
        <div><div style="font-size:11px;font-weight:900;color:var(--social);letter-spacing:.5px;text-transform:uppercase;margin-bottom:3px">Vita's read on this chapter</div>
        <div style="font-size:14px;line-height:1.55">${fb}</div></div>
      </div>
      <p style="font-size:13px;color:var(--ink-dim);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">What defined this chapter</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${recap}</div>
      <div class="advance" style="margin-top:18px"><button class="btn btn-go" onclick="doAdvance()">${last?"See your life's reflection ▸":'Advance to '+STAGES[S.stageIndex+1].name+' ▸'}</button></div>
    </div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- advance ---------- */
function doAdvance(){
  Sound.advance();
  S.log.push({stage:STAGES[S.stageIndex].name, choices:[...S._stageChoices]});
  S._stageChoices=[];
  if(S.income) S.money+=S.income;
  if(!S.flags.home) S.money-=(S.rentPerStage||0);
  S.money-=(S.kidsCost||0);
  const sn=S.stageIndex+1;
  let decay=sn*1.2; if(S.flags.junkHabit)decay+=4; if(S.flags.fitHabit)decay-=4; if(S.energy<30)decay+=4;
  S.health-=Math.max(0,Math.round(decay));
  S.energy+=S.flags.easing?12:6;
  clampStats();
  if(S.health<=0){ S.dead=true; S.deathReason='The years caught up. Your health ran out before the finish line.'; renderEnd(); return; }
  if(S.stageIndex>=STAGES.length-1){ renderEnd(); return; }
  S.stageIndex++; S.age=STAGES[S.stageIndex].startAge; S.stepIndex=0;
  setBackground(STAGES[S.stageIndex]);
  // parents pass on in later life
  if(S.stageIndex>=5 && !S._parentsGone){ S._parentsGone=true; const sync=syncPeople(S);
    if(sync.removed.some(p=>p.key==='mom'||p.key==='dad')){ Sound.leave(); S._parentsNote='As the years pass, you say goodbye to your parents. The people who started your story have left it. 🕯️'; }
  } else { syncPeople(S); }
  if(Math.random()<0.62){ queueEvent(()=>renderStageIntro()); }
  else renderStageIntro();
}

/* ---------- events & modal ---------- */
function queueEvent(after){
  const pool=EVENTS.filter(ev=>ev.cond(S)); if(!pool.length){ after(); return; }
  const ev=pool[Math.floor(Math.random()*pool.length)]; Sound.event();
  showModal({em:ev.em,title:ev.title,text:ev.text,
    opts:ev.opts.map(o=>({t:o.t,c:o.c,apply:()=>{o.apply(S);clampStats();
      if(S.health<=0){S.dead=true;S.deathReason='A life event proved too much. Your health gave out.';renderEnd();return;}}})),
    then:after});
}
function showModal({em,title,text,opts,then}){
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML=`<div class="modal"><div class="em-big">${em}</div><h3>${title}</h3><p>${text}</p>
    <div class="opts">${opts.map((o,i)=>`<div class="opt" data-i="${i}"><div class="ot">${o.t}</div><div class="oc">${o.c}</div></div>`).join('')}</div></div>`;
  document.body.appendChild(ov);
  ov.querySelectorAll('.opt').forEach(el=>{ el.addEventListener('mouseenter',()=>Sound.hover());
    el.addEventListener('click',()=>{ Sound.click(); const i=+el.dataset.i; ov.remove(); opts[i].apply(); if(!S.dead&&then)then(); }); });
}

/* ---------- tutorial ---------- */
function runTutorial(done){
  const steps=[
    {em:'👋',h:`Welcome, ${S.name}!`,t:"I'm Vita, your guide. I'll walk beside you through seven chapters of life, from university to retirement."},
    {em:'🧍',h:'This is you',t:"That character is you. They'll grow older and change with your choices — fit or frail, thriving or struggling, young to silver-haired."},
    {em:'📊',h:'Your five resources',t:"Money, Health, Energy, Mind, and Social. Spend them wisely — they shape every door that opens or closes ahead."},
    {em:'👉',h:'One choice at a time',t:"Each chapter asks a few questions. Some you must answer (●), some are optional (○). Pick a card — and watch how it ripples forward."},
    {em:'🚀',h:'Ready?',t:"There's no single way to win. Live a life worth reflecting on. Let's begin!"}
  ];
  let i=0;
  function show(){
    const s=steps[i];
    const ov=document.createElement('div'); ov.className='overlay'; ov.id='tutOv';
    ov.innerHTML=`<div class="modal" style="max-width:480px">
      <div style="width:90px;margin:0 auto 6px">${guideSprite()}</div>
      <div class="em-big" style="font-size:36px;margin-bottom:4px">${s.em}</div>
      <h3>${s.h}</h3><p>${s.t}</p>
      <div style="text-align:center"><button class="btn btn-go" id="tutNext">${i<steps.length-1?'Next ▸':"Let's go! ▸"}</button>
      ${i<steps.length-1?'<div style="margin-top:10px"><span id="tutSkip" style="font-size:12px;color:var(--ink-dim);cursor:pointer;font-weight:700">Skip intro</span></div>':''}</div></div>`;
    document.body.appendChild(ov);
    document.getElementById('tutNext').onclick=()=>{ Sound.step(); ov.remove(); i++; if(i<steps.length)show(); else done(); };
    const sk=document.getElementById('tutSkip'); if(sk) sk.onclick=()=>{ Sound.click(); ov.remove(); done(); };
  }
  show();
}

/* ============================================================
   END / REFLECTION
   ============================================================ */
function renderEnd(){
  S.dead?Sound.death():Sound.end();
  const wealth=S.money,h=S.health,en=S.energy,mn=S.mind,so=S.social;
  const pillars=[h,en,mn,so], avg=pillars.reduce((a,b)=>a+b,0)/4;
  const variance=pillars.reduce((a,b)=>a+Math.abs(b-avg),0)/4;
  const balance=Math.max(0,Math.round(100-variance*1.6));
  const wealthScore=Math.max(0,Math.min(100,Math.round(wealth/500)));
  const lifeScore=Math.round(avg*0.55+balance*0.25+wealthScore*0.20);
  const arch=archetype({wealth,h,en,mn,so,balance,married:S.flags.married,kids:S.flags.kids,legacy:S.flags.legacy,dead:S.dead});
  const named={'❤️ Health':h,'⚡ Energy':en,'🧠 Mind':mn,'🤝 Social':so};
  const sorted=Object.entries(named).sort((a,b)=>b[1]-a[1]);
  const strongest=sorted[0],weakest=sorted[sorted.length-1];
  const timeline=S.log.filter(l=>l.choices&&l.choices.length).map(l=>`<div class="tl-item"><div class="tl-stage">${l.stage}</div><div class="tl-choices">${l.choices.join(' · ')}</div></div>`).join('');
  const peeps = S.people.length?S.people.map(personHTML).join(''):'';

  app.innerHTML=`
    ${kpiHTML()}
    ${S.dead?`<div class="stage-intro" style="border-color:rgba(255,93,126,.4)"><h3>⚰️ The Story Ended Early</h3><p>${S.deathReason} You reached age ${S.age}.</p></div>`:''}
    <div class="end-archetype">${drawPlayer(S)}<h2>${arch.title}</h2><div class="desc">${arch.desc}</div></div>
    <div class="end-stats">
      <div class="es"><div class="v" style="color:var(--money)">$${wealth.toLocaleString()}</div><div class="l">Net Worth</div></div>
      <div class="es"><div class="v" style="color:var(--mind)">${lifeScore}</div><div class="l">Life Score</div></div>
      <div class="es"><div class="v" style="color:var(--energy)">${balance}</div><div class="l">Balance</div></div>
      <div class="es"><div class="v">${S.age}</div><div class="l">Final Age</div></div>
    </div>
    ${peeps?`<div class="reflect"><h3>👥 Who was with you at the end</h3><div class="people-row" style="margin-top:6px">${peeps}</div></div>`:''}
    <div class="reflect">
      <h3>🧾 End-of-Life Reflection</h3>
      <div class="q"><div class="qq">Did your choices create balance or imbalance?</div><div class="qa">Your balance score is <b>${balance}/100</b>. ${balance>70?'Remarkably even — you refused to sacrifice any one part of yourself for another.':balance>45?'Reasonably balanced, with some pillars leaning harder than others.':'Quite lopsided — you poured yourself into some areas and let others wither.'}</div></div>
      <div class="q"><div class="qq">Which resource did you protect most — and what did it cost you?</div><div class="qa">You protected <b>${strongest[0]}</b> the most (${strongest[1]}/100), while <b>${weakest[0]}</b> was left thinnest (${weakest[1]}/100). ${costLine(strongest[0])}</div></div>
      <div class="q"><div class="qq">How did early habits echo later in life?</div><div class="qa">${echoLine()}</div></div>
      <div class="q"><div class="qq">What did you build that outlasts you?</div><div class="qa">${legacyLine()}</div></div>
    </div>
    <div class="reflect"><h3>🗺️ The Path You Walked</h3><div class="timeline">${timeline||'<div class="tl-choices">A quiet life with few recorded turning points.</div>'}</div></div>
    <div style="text-align:center;margin-top:22px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <button class="btn btn-go" onclick="renderSetup()">Live Another Life ↺</button>
    </div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}
function costLine(strong){
  if(strong.includes('Mind')) return 'A sharp mind opened doors — but ambition can crowd out rest and relationships.';
  if(strong.includes('Social')) return 'You kept your people close — the richest currency, if sometimes the most demanding.';
  if(strong.includes('Health')) return 'You guarded the one resource that lets you enjoy all the others.';
  return 'Energy fueled everything — but burning bright can mean burning out.';
}
function echoLine(){
  if(S.flags.fitHabit && S.health>=60) return 'The healthy habits you started young paid compounding dividends — your body outlasted the stress of every career you chased.';
  if(S.flags.junkHabit && S.health<50) return 'The shortcuts you took early — fast food, skipped checkups — quietly added up, and your later health bore the cost.';
  if(S.flags.degree && S.money>15000) return 'That expensive graduate degree looked reckless at 24, but it unlocked the doors that built your wealth.';
  if(S.flags.car && S.flags.married) return 'A small thing — buying that used car — widened your world and led you to the partner you built a family with.';
  return 'The small, ordinary decisions of your twenties set the trajectory for everything that followed. They always do.';
}
function legacyLine(){
  const b=[];
  if(S.flags.kids)b.push('a family you raised'); if(S.flags.legacy)b.push('a community project that lives on');
  if(S.flags.mentor)b.push('people you mentored and lifted'); if(S.social>=70)b.push('a wide circle who remember you warmly');
  if(S.money>=25000)b.push('financial security to pass down');
  if(!b.length) return 'Perhaps the quietest legacy of all: a life lived on your own terms.';
  return 'You leave behind '+b.join(', ')+'. Not bad for one ticket.';
}
function archetype(d){
  if(d.dead) return {title:'A Life Cut Short',desc:'The simulation ended before the final chapter - a reminder that health is the silent foundation every other ambition stands on.'};
  if(d.balance>72 && d.wealth>12000) return {title:'The Renaissance Soul',desc:'You refused the false choice between wealth and wellbeing. Money, mind, body, and people - you kept them all alive. Rare, and quietly heroic.'};
  if(d.wealth>30000 && d.so<45) return {title:'The Tycoon',desc:'You won the money game decisively. The corner office was yours - though the dinner table was sometimes empty.'};
  if(d.so>=72 && d.wealth<15000) return {title:'The Beloved',desc:"You were rich in the currency that doesn't show up in a bank account. People, not possessions, defined your life."};
  if(d.mn>=80) return {title:'The Sage',desc:'A life of relentless learning. Your mind was your greatest asset and your finest legacy.'};
  if(d.h>=75) return {title:'The Evergreen',desc:'You aged like a strong tree - health protected, energy intact. You will enjoy these final chapters more than most.'};
  if(d.kids && d.married) return {title:'The Family Anchor',desc:'You built a home and filled it. Through every crash and pivot, the family you raised was the thing that held.'};
  return {title:'The Wayfarer',desc:'A middling, very human course - a few triumphs, a few regrets, no single thing taken to its extreme. The most common life, and not a bad one.'};
}

   ============================================================ */
function computeLook(s){
  const ab=['young','young','adult','established','mature','senior','elder'][s.stageIndex]||'elder';
  const h=s.health, en=s.energy;
  let phys;
  if(s.flags.fitHabit && h>=80 && en>=45) phys='muscular';
  else if(s.flags.fitHabit && h>=60) phys='fit';
  else if(s.flags.junkHabit && h<50) phys='heavy';
  else if(s.flags.junkHabit && h<72) phys='soft';
  else if(h<38 || en<24) phys='frail';
  else if(h<56 && en<46) phys='lean';
  else phys='average';
  const wb=(h+en+s.social)/3 + (s.money>=5000?8:0);
  const mood = wb>=66?'happy': wb>=42?'neutral':'sad';
  const wealth = s.money<2000?'low': s.money<15000?'mid':'rich';
  return {ab,phys,mood,wealth,gender:s.gender,stage:s.stageIndex};
}
function stateLabel(s){
  const L=computeLook(s);
  const age={young:'Young',adult:'Twenties',established:'Thirties',mature:'Midlife',senior:'Senior',elder:'Golden Years'}[L.ab];
  const phys={muscular:'Athletic',fit:'Fit',average:'Average',lean:'Lean',soft:'Soft',heavy:'Heavy-set',frail:'Frail'}[L.phys];
  const mood={happy:'Thriving',neutral:'Getting by',sad:'Struggling'}[L.mood];
  return `${age} · ${phys} · ${mood}`;
}
function drawPlayer(s){
  const L=computeLook(s);
  const cx=110, cy=96;
  const P={muscular:{rx:44,ry:44,sh:90,arm:18,belly:0},
           fit:{rx:42,ry:44,sh:80,arm:12,belly:0},
           average:{rx:43,ry:45,sh:70,arm:12,belly:6},
           lean:{rx:38,ry:43,sh:60,arm:8,belly:0},
           soft:{rx:47,ry:46,sh:82,arm:15,belly:16},
           heavy:{rx:51,ry:47,sh:96,arm:18,belly:28},
           frail:{rx:37,ry:42,sh:54,arm:7,belly:-4}}[L.phys];
  const rx=P.rx, ry=P.ry, sh=P.sh, arm=P.arm, belly=P.belly;
  const skin='#f3c79b';
  const hairCol={young:'#4a3526',adult:'#4a3526',established:'#473122',mature:'#7a6a55',senior:'#a7a7a7',elder:'#e4e4e4'}[L.ab];
  const moodAura=L.mood==='happy'?'#7ef5d0':L.mood==='neutral'?'#bcd2ff':'#e0cdee';
  const outfit=L.wealth==='low'?'#9aa3b8':L.wealth==='mid'?'#5b8def':'#7b5cff';
  const outfit2=L.wealth==='low'?'#828ba5':L.wealth==='mid'?'#4a78e0':'#6a48c8';
  const glasses=(L.ab==='senior'||L.ab==='elder');
  const eyeDX=15, eyeY=90;

  let hairBack='';
  if(L.gender==='f') hairBack=`<path d="M${cx-rx-7} ${cy-6} Q ${cx-rx-12} 180 ${cx-rx+6} 184 L ${cx+rx-6} 184 Q ${cx+rx+12} 180 ${cx+rx+7} ${cy-6} Z" fill="${hairCol}"/>`;
  else if(L.gender==='o') hairBack=`<path d="M${cx-rx-5} ${cy-4} Q ${cx-rx-8} ${cy+ry+18} ${cx-rx+8} ${cy+ry+20} L ${cx+rx-8} ${cy+ry+20} Q ${cx+rx+8} ${cy+ry+18} ${cx+rx+5} ${cy-4} Z" fill="${hairCol}"/>`;

  function armHTML(x){
    let m=`<rect x="${x-arm/2}" y="190" width="${arm}" height="78" rx="${arm/2}" fill="${skin}"/>`;

  }
  const ax=cx+(sh-arm/2), lax=cx-(sh-arm/2);

    eyes=`<path d="M${cx-eyeDX-7} ${eyeY+2} q7 -8 14 0" stroke="#3a2b50" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M${cx+eyeDX-7} ${eyeY+2} q7 -8 14 0" stroke="#3a2b50" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  } else {
    const r=L.mood==='sad'?3.4:4;
    eyes=`<circle cx="${cx-eyeDX}" cy="${eyeY}" r="${r}" fill="#3a2b50"/><circle cx="${cx+eyeDX}" cy="${eyeY}" r="${r}" fill="#3a2b50"/>`;
    if(L.mood==='sad') eyes+=`<path d="M${cx-eyeDX-7} ${eyeY-8} l13 4" stroke="#3a2b50" stroke-width="2.4" stroke-linecap="round"/><path d="M${cx+eyeDX+7} ${eyeY-8} l-13 4" stroke="#3a2b50" stroke-width="2.4" stroke-linecap="round"/>`;
  }
  const my=118;
  let mouth = L.mood==='happy'?`<path d="M${cx-18} ${my} q18 17 36 0" stroke="#b5536b" stroke-width="3.4" fill="none" stroke-linecap="round"/>`
            : L.mood==='neutral'?`<path d="M${cx-12} ${my+4} h24" stroke="#b5536b" stroke-width="3.2" fill="none" stroke-linecap="round"/>`
            : `<path d="M${cx-15} ${my+7} q15 -13 30 0" stroke="#b5536b" stroke-width="3.2" fill="none" stroke-linecap="round"/>`;
  const cheeks=(L.mood==='happy'&&s.health>=55)?`<circle cx="${cx-28}" cy="106" r="6" fill="#ff9ec7" opacity=".55"/><circle cx="${cx+28}" cy="106" r="6" fill="#ff9ec7" opacity=".55"/>`:'';
  const gl=glasses?`<g stroke="#5a5a6e" stroke-width="2.2" fill="none"><circle cx="${cx-eyeDX}" cy="${eyeY}" r="11"/><circle cx="${cx+eyeDX}" cy="${eyeY}" r="11"/><line x1="${cx-4}" y1="${eyeY}" x2="${cx+4}" y2="${eyeY}"/></g>`:'';
  const lines=(L.ab==='mature'||L.ab==='senior'||L.ab==='elder')?`<path d="M${cx-rx+8} 72 q8 -4 16 0" stroke="#cda" stroke-width="1.6" fill="none" opacity=".5"/>`:'';
  const thin=(L.ab==='elder'&&L.gender==='m');
  const fringe=`<path d="M${cx-rx-2} ${cy} Q ${cx-rx-2} ${cy-ry-18} ${cx} ${cy-ry-20} Q ${cx+rx+2} ${cy-ry-18} ${cx+rx+2} ${cy} Q ${cx+12} ${cy-ry*0.45} ${cx-8} ${cy-ry*0.3} Q ${cx-rx+6} ${cy-ry*0.2} ${cx-rx-2} ${cy} Z" fill="${hairCol}" opacity="${thin?0.55:1}"/>`;
  let acc='';
  if(L.wealth==='rich'){
    if(L.gender==='m') acc=`<path d="M${cx-7} 152 l7 -8 7 8 -7 30z" fill="#ffd24a"/>`;
    else acc=`<path d="M${cx-22} 150 q22 22 44 0" stroke="#ffd24a" stroke-width="3" fill="none"/><circle cx="${cx}" cy="166" r="4" fill="#ffd24a"/>`;
  }
  const cane=(L.ab==='elder')?`<line x1="${cx+sh+6}" y1="200" x2="${cx+sh+22}" y2="278" stroke="#8a5a2b" stroke-width="5" stroke-linecap="round"/><circle cx="${cx+sh+6}" cy="200" r="5" fill="#8a5a2b"/>`:'';
  const belom = belly||0;
  const torso=`<path d="M${cx-sh} 290 C ${cx-sh-belom*0.3} 252 ${cx-sh-belom} 226 ${cx-sh} 212 Q ${cx-sh} 184 ${cx-18} 178 L ${cx+18} 178 Q ${cx+sh} 184 ${cx+sh} 212 C ${cx+sh+belom} 226 ${cx+sh+belom*0.3} 252 ${cx+sh} 290 Z" fill="${outfit}"/>`;

  return `<svg viewBox="0 0 220 290" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="${cx}" cy="150" rx="102" ry="132" fill="${moodAura}" opacity=".22"/>
    ${hairBack}
    ${armHTML(lax)}${armHTML(ax)}
    ${torso}
    <path d="M${cx-18} 178 L${cx} 196 L${cx+18} 178 Z" fill="${outfit2}"/>
    ${acc}
    <rect x="${cx-13}" y="132" width="26" height="20" rx="9" fill="${skin}"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${skin}"/>
    ${lines}${cheeks}${fringe}${eyes}${gl}${mouth}
    <ellipse cx="${cx-rx+4}" cy="${cy+6}" rx="6" ry="9" fill="#e9b483" opacity=".4"/>
    <ellipse cx="${cx+rx-4}" cy="${cy+6}" rx="6" ry="9" fill="#e9b483" opacity=".4"/>
    ${cane}
  </svg>`;
}

function choiceCard(ch, reason){
  const e=ch.effect||{}; let chips='';
  ['money','health','energy','mind','social'].forEach(k=>{ if(e[k]){ const pos=e[k]>0;
    const v=k==='money'?(pos?'+$':'-$')+Math.abs(e[k]).toLocaleString():(pos?'+':'')+e[k];
    chips+=`<span class="chip ${pos?'pos':'neg'}">${STAT[k].e} ${v}</span>`; }});
  if(ch.income) chips+=`<span class="chip unlock">💵 +$${ch.income.toLocaleString()}/chapter</span>`;
  if(ch.rent) chips+=`<span class="chip neg">🏠 -$${ch.rent}/chapter</span>`;
  if(ch.kids) chips+=`<span class="chip neg">👶 -$${ch.kids}/chapter</span>`;
  if(ch.persist) chips+=`<span class="chip unlock">🔓 ${OWNED[ch.persist]||'Unlock'}</span>`;
  if(ch.id==='dating' && S.flags.car) chips+=`<span class="chip unlock">🚗 Car bonus +🤝</span>`;
  let cond='';
  if(COND[ch.id]){ const r=COND[ch.id](S); cond=`<div class="cond ${r[1]?'met':'unmet'}">${r[1]?'✓ Requires':'🔒 Requires'} ${r[0]}</div>`; }
  if(reason){
    return `<div class="card locked"><div class="ttl"><span class="em">${ch.em}</span>${ch.t}</div>
      <div class="ds">${ch.d}</div><div class="chips">${chips}</div>${cond||`<div class="lock-note">🔒 ${reason}</div>`}</div>`;
  }
  return `<div class="card" onclick="chooseStep('${ch.id}',this)"><div class="ttl"><span class="em">${ch.em}</span>${ch.t}</div>
    <div class="ds">${ch.d}</div><div class="chips">${chips}</div>${cond}</div>`;
}

/* ============================================================
   DEEP, CHOICE-REFLECTIVE STAGE FEEDBACK
   ============================================================ */
function stageFeedback(){
  const s=S, f=s.flags, P=[];
  const lead={0:"University's behind you.",1:"Your career is taking shape.",2:"You're finding your footing.",3:"These are the building years.",4:"You're nearing your peak.",5:"The wind-down has begun.",6:"The final chapter closes."}[s.stageIndex]||"";
  // critical risks first
  if(s.health<35) P.push(`Your health has fallen to a critical ${s.health} — protect it next chapter, or the story could end before its time.`);
  if(s.energy<28) P.push(`You're running on fumes (${s.energy} energy); without real recovery, burnout will start eating into your health.`);
  if(s.money<0) P.push(`You're in the red — income has to come before any further spending, or debt will define the chapters ahead.`);
  // habit observation tied to outcome
  if(f.fitHabit && s.health>=65) P.push(`The discipline you've put into your body is compounding: at ${s.health} health, you're aging far better than most.`);
  else if(f.junkHabit && s.health<62) P.push(`Those convenient shortcuts are showing — health has slipped to ${s.health}, and that bill keeps growing.`);
  // mind leverage / bottleneck
  if(s.mind>=78) P.push(`Your mind (${s.mind}) is genuinely rare, and it's unlocking the doors — leadership, senior roles — most people never reach.`);
  else if(s.mind<42 && s.stageIndex<=3) P.push(`Knowledge is your bottleneck at ${s.mind}; the best-paying paths stay locked until you invest in it.`);
  // social
  if(s.social>=72) P.push(`You're surrounded by people who matter — that web of support is quietly one of the strongest assets you hold.`);
  else if(s.social<35) P.push(`You're drifting solo (${s.social} social); closeness is far harder to rebuild later than it is to keep now.`);
  // relationship / life trajectory (forward-looking, choice-specific)
  if(f.car && !f.dating && s.stageIndex===1) P.push(`You bought the car but never put yourself out there — those doors don't stay open forever.`);
  else if(f.dating && !f.partner && s.stageIndex===1) P.push(`You've started dating; whether it becomes something lasting is the question waiting in the next chapter.`);
  else if(f.partner && !f.married && s.stageIndex<=2) P.push(`You have a serious partner but no ring yet — the family chapter only opens if you commit.`);
  else if(f.married && !f.kids && s.stageIndex===3) P.push(`Married, no children yet — that door is open to you this decade if you want it.`);
  else if(f.kids) P.push(`With children in your life, every later choice now carries weight beyond just you.`);
  // wealth freedom
  if(s.money>=20000) P.push(`With $${s.money.toLocaleString()} banked, you've bought yourself something rare: real freedom of choice.`);
  // degree payoff
  if(f.degree && s.stageIndex>=2 && s.mind>=70) P.push(`That graduate degree looked expensive at the time — now it's the reason the top tier is within reach.`);
  if(!P.length) P.push(`A steady, balanced chapter — no crisis and no standout. Consistency like this is what wins the long game.`);
  return lead+' '+P.slice(0,3).join(' ');
}

/* ============================================================
   MILESTONE POPUPS + hooks
   ============================================================ */
let _popQ=[], _popActive=false;
function gamePopup(p){ _popQ.push(p); if(!_popActive) _popNext(); }
function _popNext(){
  if(!_popQ.length){ _popActive=false; return; }
  _popActive=true; const p=_popQ.shift();
  let d; try{ d=document.createElement('div'); }catch(e){ _popActive=false; return; }
  d.className='gpop';
  d.innerHTML=`<div class="gpop-ic" style="${p.discStyle||''}">${p.icon}</div><div><div class="gpop-t">${p.title}</div>${p.sub?`<div class="gpop-s">${p.sub}</div>`:''}</div>`;
  try{ document.body.appendChild(d); }catch(e){}
  setTimeout(()=>{ try{d.classList.add('in');}catch(e){} },30);
  setTimeout(()=>{ try{d.classList.remove('in'); d.classList.add('out');}catch(e){}
    setTimeout(()=>{ try{d.remove();}catch(e){} _popNext(); },460); }, 2150);
}
function _msSnap(){ return {money:S.money,mind:S.mind,health:S.health,energy:S.energy,social:S.social,
  phys:computeLook(S).phys, keys:S.people.map(p=>p.key)}; }
function _flashAvatar(){ try{ const a=document.getElementById('avatarCard'); if(a){ a.classList.remove('morph'); void a.offsetWidth; a.classList.add('morph'); } }catch(e){} }
function _fireMilestones(b){
  if(!b) return;
  // 1) new people appear
  const had=new Set(b.keys);
  S.people.forEach(p=>{ if(!had.has(p.key)){
    let title, sub;
    if(p.rel==='Spouse'){ title=`You married ${p.name}! 💍`; sub='A life partner joins your story.'; }
    else if(p.rel==='Child'){ title=`${p.name} was born! 👶`; sub='Your family is growing.'; }
    else if(p.rel==='Partner'){ title=`${p.name} is now your partner 💞`; sub='Things are getting serious.'; }
    else { title=`You made a new ${p.rel.toLowerCase()}!`; sub=`${p.name} joins the people in your life.`; }
    gamePopup({icon:p.emoji, discStyle:`background:radial-gradient(circle at 35% 30%, hsl(${p.hue},90%,82%), hsl(${p.hue},70%,62%));`, title, sub});
    if(typeof Sound!=='undefined') Sound.join();
  }});
  // 2) savings every $500
  if(S.money>b.money && S.money>0){
    const lo=Math.floor(b.money/500), hi=Math.floor(S.money/500);
    if(hi>lo) gamePopup({icon:'💰',title:`$${(hi*500).toLocaleString()} banked!`,sub:'Your savings are climbing — every dollar buys you options.'});
  }
  // 3) mind milestones — "investing in your mind"
  [40,60,80].forEach(t=>{ if(b.mind<t && S.mind>=t) gamePopup({icon:'🧠',title:`Intelligence reached ${t}!`,sub:"You're investing in your intelligence — sharper thinking, bigger doors."}); });
  // 4) body in peak shape
  if(b.health<80 && S.health>=80) gamePopup({icon:'💪',title:'Peak condition!',sub:"You're investing in your body — strength that pays off for years."});
  // 5) physique transformation
  const np=computeLook(S).phys;
  if(np!==b.phys){
    const m={muscular:['💪',"You've built real muscle!"],fit:['🏃',"You're getting in shape!"],
             heavy:['🍔','The lifestyle is catching up with you…'],frail:['🥀','Your body is wearing down.'],
             soft:['😮‍💨',"You've gone a little soft."],lean:['🌿',"You're lean and light."]}[np];
    if(m){ gamePopup({icon:m[0],title:m[1],sub:'Your character changes with your choices.'}); _flashAvatar(); }
  }
}

function tlCard(stage, choices, stats, opts){
  opts=opts||{};
  const chips = (choices&&choices.length)? choices.map(c=>`<span class="tl-chip">${c}</span>`).join('') : '<span class="tl-empty">No choices recorded</span>';
  const st = stats? `<div class="tl-stats">💰 $${stats.money.toLocaleString()} · ❤️ ${stats.health} · ⚡ ${stats.energy} · 🧠 ${stats.mind} · 🤝 ${stats.social}</div>` : '';
  const cls = opts.current?'cur':'done';
  const tag = opts.current?'<span class="tl-now">● You are here</span>':'';
  return `<div class="tl-item ${cls}"><div class="tl-node">${stage.emoji}</div>
    <div class="tl-content"><div class="tl-title">${stage.name} <span class="tl-age">Age ${stage.age}</span> ${tag}</div>
    <div class="tl-chips">${chips}</div>${st}</div></div>`;
}
function timelineBody(){
  if(typeof S==='undefined' || !S || S.stageIndex===undefined){
    return `<div class="tl-none">Your life hasn't begun yet.<br>Start a life and your timeline will fill in, chapter by chapter, as you make your choices.</div>`;
  }
  let h='<div class="tl-track">';
  S.log.forEach((e,i)=>{ if(STAGES[i]) h+=tlCard(STAGES[i], e.choices, e.end, {}); });
  if(S.log.length===S.stageIndex && S.stageIndex<STAGES.length && !S.dead){
    h+=tlCard(STAGES[S.stageIndex], S._stageChoices, {money:S.money,health:S.health,energy:S.energy,mind:S.mind,social:S.social}, {current:true});
  }
  h+='</div>';

}
function openTimeline(){

function _applyConsequences(){
  if(typeof S==='undefined' || !S || S.dead) return;
  const stage=S.stageIndex;
  // 1) Neglected social life -> you lose touch with a friend
  if(S.social<45){
    const friends=(S.people||[]).filter(p=>p.rel==='Friend');
    if(friends.length){
      const lost=friends[friends.length-1];
      S.social=Math.max(0,S.social-6);
      gamePopup({icon:'💔',title:`You drifted apart from ${lost.name}`,sub:'A neglected social life quietly costs you the people in it.'});
      if(typeof Sound!=='undefined' && Sound.leave) Sound.leave();
    } else {
      S.social=Math.max(0,S.social-3); // isolation deepens
    }
  }
  // 2) Stopped training -> the muscle fades (sustained health neglect only)
  if(S.flags.fitHabit && S.health<48){
    S.flags.fitHabit=false;
    S.health=Math.max(0,S.health-3);
    gamePopup({icon:'💪',title:`You've lost your muscle`,sub:'Months without training and the strength quietly faded — fitness has to be kept up.'});
    if(typeof Sound!=='undefined' && Sound.leave) Sound.leave();
  }
  // 3) Neglected health care -> a specific, cause-linked illness that costs real money
  if(S.health<42 || (S.flags.junkHabit && S.health<55)){
    const bill = 600 + stage*400;
    S.money -= bill;
    S.health = Math.max(0, S.health-4);
    const ail=_diagnose();
    gamePopup({icon:'🏥',title:`Diagnosed: ${ail.name}`,sub:`Brought on by ${ail.cause}. You spend exactly $${bill.toLocaleString()} on treatment.`});
    if(typeof Sound!=='undefined' && Sound.bad) Sound.bad();
  }
  if(typeof clampStats==='function') clampStats();
}
/* pick an illness whose cause matches what the player neglected */
function _diagnose(){
  const s=S, pick=a=>a[Math.floor(Math.random()*a.length)];
  const overworked = (s.flags.exec||s.flags.senior||s.flags.promoted) && s.energy<50;
  if(s.energy<33) return pick([
    {name:'a stress ulcer',cause:'months of too little sleep and relentless pressure'},
    {name:'chronic insomnia & fatigue',cause:'running on far too little rest for too long'},
    {name:'burnout-related anxiety',cause:'pushing yourself with no recovery'}]);
  if(overworked) return pick([
    {name:'stress-induced hypertension',cause:'the constant toll of work stress'},
    {name:'a stress-related heart scare',cause:'years of high pressure and no balance'}]);
  if(s.flags.junkHabit) return pick([
    {name:'high blood pressure',cause:'years of fast food and skipped checkups'},
    {name:'early type-2 diabetes',cause:'a poor diet that finally caught up'},
    {name:'a cardiac warning',cause:'a heart strained by junk food and inactivity'}]);
  return pick([
    {name:'a serious chest infection',cause:'a run-down body with no reserves left'},
    {name:'a worrying check-up result',cause:'a health you stopped looking after'},
    {name:'severe migraines',cause:'chronic stress and exhaustion'}]);
}

function _showConsequences(items){

  try{ document.body.appendChild(ov);}catch(e){}

function _applyConsequences(){
  if(typeof S==='undefined' || !S || S.dead) return;
  const stage=S.stageIndex, items=[];
  // Stopped exercising -> lost the muscle
  if(S.flags.fitHabit && S.health<48){
    S.flags.fitHabit=false; S.health=Math.max(0,S.health-3);
    items.push({icon:'💪',title:'You lost your fitness',detail:'Months with no exercise and the muscle faded away. <span class="cons-cost">Health −3</span>, and your fit body is gone.'});
  }
  // No energy -> burnout delayed your work and cost money
  if(S.energy<30){
    const loss=400+stage*250, e0=S.energy;
    S.money-=loss; S.health=Math.max(0,S.health-3);
    items.push({icon:'🔥',title:'You burned out',detail:`Running on empty (energy ${e0}), you missed deadlines and a project slipped. It cost you <span class="cons-cost">$${loss.toLocaleString()}</span> and 3 health.`});
  }
  // Ignored health care -> you got sick and paid for treatment
  if(S.health<42 || (S.flags.junkHabit && S.health<55)){
    const bill=600+stage*400, ail=_diagnose();
    S.money-=bill; S.health=Math.max(0,S.health-4);
    items.push({icon:'🏥',title:`You were diagnosed with ${ail.name}`,detail:`Brought on by ${ail.cause}. The treatment cost you <span class="cons-cost">$${bill.toLocaleString()}</span>, and your health dropped 4.`});
  }
  // Low social life -> you lost a friend
  if(S.social<45){
    const friends=(S.people||[]).filter(p=>p.rel==='Friend');
    if(friends.length){ const lost=friends[friends.length-1]; S.social=Math.max(0,S.social-6);
      items.push({icon:'💔',title:`You lost touch with ${lost.name}`,detail:'You were too busy for the people around you, and a friendship quietly faded. <span class="cons-cost">Social −6</span>.'});
    } else { S.social=Math.max(0,S.social-3);
      items.push({icon:'😔',title:'Loneliness crept in',detail:'With no one close by, the isolation got worse. <span class="cons-cost">Social −3</span>.'});
    }
  }
  // In the red -> debt interest costs you more
  if(S.money < -200){
    const interest=Math.round(Math.abs(S.money)*0.15); S.money-=interest;
    items.push({icon:'🏦',title:'Your debt grew',detail:`Interest piled onto what you owe — it cost you another <span class="cons-cost">$${interest.toLocaleString()}</span>.`});
  }
  if(typeof clampStats==='function') clampStats();
  if(items.length) _showConsequences(items);
}

/* milestone pop-ups: keep only the GOOD news (bad news is in the consequence screen) */
function _fireMilestones(b){
  if(!b) return;
  const had=new Set(b.keys);
  S.people.forEach(p=>{ if(!had.has(p.key)){
    let title,sub;
    if(p.rel==='Spouse'){title=`You married ${p.name}! 💍`;sub='A life partner joins your story.';}
    else if(p.rel==='Child'){title=`${p.name} was born! 👶`;sub='Your family is growing.';}
    else if(p.rel==='Partner'){title=`${p.name} is now your partner 💞`;sub='Things are getting serious.';}
    else {title=`You made a new ${p.rel.toLowerCase()}!`;sub=`${p.name} joins the people in your life.`;}
    gamePopup({icon:p.emoji,discStyle:`background:radial-gradient(circle at 35% 30%, hsl(${p.hue},90%,82%), hsl(${p.hue},70%,62%));`,title,sub});
    if(typeof Sound!=='undefined') Sound.join();
  }});
  if(S.money>b.money && S.money>0){ const lo=Math.floor(b.money/500), hi=Math.floor(S.money/500);
    if(hi>lo) gamePopup({icon:'💰',title:`$${(hi*500).toLocaleString()} banked!`,sub:'Your savings are climbing — every dollar buys you options.'}); }
  [40,60,80].forEach(t=>{ if(b.mind<t && S.mind>=t) gamePopup({icon:'🧠',title:`Intelligence reached ${t}!`,sub:"You're investing in your intelligence — sharper thinking, bigger doors."}); });
  if(b.health<80 && S.health>=80) gamePopup({icon:'💪',title:'Peak condition!',sub:"You're investing in your body — strength that pays off for years."});
  const np=computeLook(S).phys;
  if(np!==b.phys && (np==='muscular'||np==='fit')) gamePopup({icon:np==='muscular'?'💪':'🏃',title:np==='muscular'?"You've built real muscle!":"You're getting in shape!",sub:'Your body is changing with your choices.'});
}

function openPurchase(kind, fromStep){
  const p=PURCHASES[kind]; if(!p) return; if(typeof Sound!=='undefined')try{Sound.click();}catch(e){}
  closePurchase();
  const fs = fromStep?1:0;
  const verb = kind==='partner' ? 'Date' : 'Buy';
  const cards=p.options.map((o,i)=>({o,i}))
    .filter(({o})=> kind!=='partner' || !o.gender || o.gender!==S.gender)  // heterosexual: opposite gender only
    .map(({o,i})=>{
    const afford=S.money>=(o.cost||0);
    const eff=['money','health','energy','mind','social'].map(k=>{ if(!o.effect||!o.effect[k])return ''; const pos=o.effect[k]>0;
      return `<span class="chip ${pos?'pos':'neg'}">${STAT[k].e} ${pos?'+':''}${o.effect[k]}</span>`; }).join('');
    const isEx = kind==='partner' && S._ex && o.name===S._ex;
    const head = kind==='partner'
      ? `<div class="pportrait">${_partnerSVG(o)}</div><div class="bt">${o.name}</div><div class="page">Age ${o.age} · ${o.hobby}</div>${isEx?`<span class="ex-tag">Your ex-${S.gender==='f'?'boyfriend':'girlfriend'}</span>`:''}`
      : `<div class="be">${o.em}</div><div class="bt">${o.label}</div>`;
    return `<div class="buy-card${isEx?' ex':''}">${head}<div class="bd">${isEx?'It ended. Some doors don’t reopen.':o.desc}</div>
      <div class="bprice">$${(o.cost||0).toLocaleString()}</div>
      <div class="chips" style="justify-content:center;margin-bottom:8px">${eff}</div>
      <button class="bbtn" ${(afford&&!isEx)?'':'disabled'} onclick="applyPurchase('${kind}',${i},${fs})">${isEx?'Not an option':(afford?verb:'Need $'+(o.cost||0).toLocaleString())}</button></div>`;
  }).join('');
  let ov; try{ ov=document.createElement('div'); }catch(e){ return; }
  ov.className='buy-ov'; ov.id='buyOv';
  const subMsg = kind==='partner'
    ? `You have 💰 $${S.money.toLocaleString()}. Pick someone to start dating — or come back later.`
    : `You have 💰 $${S.money.toLocaleString()}. Choose an option — buy it now, or come back when you can afford more.`;
  ov.innerHTML=`<div class="buy-modal"><h2>${p.icon} ${p.label}</h2>
    <div class="sub">${subMsg}</div>
    <div class="buy-grid">${cards}</div>
    <button class="buy-close" onclick="closePurchase()">Maybe later</button></div>`;
  ov.addEventListener('click',e=>{ if(e.target===ov) closePurchase(); });
  document.body.appendChild(ov);
}
function closePurchase(){ try{ const o=document.getElementById('buyOv'); if(o) o.remove(); }catch(e){} }
function applyPurchase(kind, i, fromStep){
  const p=PURCHASES[kind]; if(!p) return; const o=p.options[i]; if(!o) return;
  if(S.money < (o.cost||0)) return;
  if(typeof Sound!=='undefined'){ try{ Sound.unlock(); }catch(e){} }
  const e=o.effect||{};
  ['health','energy','mind','social'].forEach(k=>{ if(e[k]) S[k]+=e[k]; });
  if(e.money) S.money+=e.money;
  if(o.cost) S.money-=o.cost;
  if(o.rent!==undefined) S.rentPerStage=o.rent;
  S._nameCache=S._nameCache||{};
  if(o.name) S._nameCache.partner=o.name;
  if(kind==='marriage' && S._nameCache.partner) S._nameCache.spouse=S._nameCache.partner;
  if(o.set) o.set.forEach(f=>S.flags[f]=true);
  if(typeof clampStats==='function') clampStats();
  if(Array.isArray(S._stageChoices)) S._stageChoices.push(o.em+' '+o.label);
  let joined=null; if(typeof syncPeople==='function'){ const sync=syncPeople(S); if(sync&&sync.added&&sync.added.length) joined=sync.added[0]; }
  if(kind==='partner'){ if(S.flags) S.flags._brokeUp=false; const pp=(S.people||[]).find(x=>x.rel==='Partner'); if(pp){ if(o.hue!=null)pp.hue=o.hue; pp.emoji=(o.gender==='f'?'👩':'👨'); if(o.name)pp.name=o.name; } }
  closePurchase();
  const msg = kind==='marriage' ? '💍 You got married'+(joined?(' — '+joined.name+' is now your spouse'):'')+'!'
    : kind==='partner' ? '💞 '+(o.name||'A partner')+' is now part of your life.'
    : kind==='car' ? '🚗 New wheels! You bought a '+o.label+'.'
    : '🏡 You bought a home — the rent stops here!';
  if(typeof gamePopup==='function') gamePopup({icon:p.icon, title:msg});
  if(fromStep && typeof S.stepIndex==='number') S.stepIndex++;   // completing an in-chapter question advances it
  if(typeof MP!=='undefined' && MP.active && MP.saveTeam) MP.saveTeam();
  if(S.health<=0){ S.dead=true; S.deathReason='Your health gave out. The body keeps the score.'; if(typeof renderEnd==='function'){ renderEnd(); return; } }
  renderStep();
}

/* ============================================================
   v4.2: universal double-click shield.
   A second real click on (or at the same spot as) any interactive
   control within 350ms is swallowed before its handler runs.
   Covers: choice cards, Begin/Advance/Skip, consequence Continue,
   tutorial Next, event-modal options, goal chips, Buy/Date buttons,
   lobby roles, trainer buttons, downloads — everything clickable.
   Programmatic clicks (tests) pass unless window.__forceGuard is set.
   ============================================================ */
(function(){
  let lastT=0, lastX=-999, lastY=-999, lastEl=null;
  const SEL='button, .card, .opt, .goal-chip, .bbtn, .btn, .mp-role, .mp-team, .mp-g, .buy-close, summary';
  document.addEventListener('click', function(ev){
    if(!(ev.isTrusted || window.__forceGuard)) return;
    const el = ev.target && ev.target.closest ? ev.target.closest(SEL) : null;
    if(!el) return;
    const now = Date.now();
    const near = Math.abs((ev.clientX||0)-lastX)<12 && Math.abs((ev.clientY||0)-lastY)<12;
    if(now-lastT<350 && (el===lastEl || near)){
      ev.stopImmediatePropagation(); ev.preventDefault();
      return;
    }
    lastT=now; lastX=ev.clientX||0; lastY=ev.clientY||0; lastEl=el;
  }, true);
})();

/* v4.2b: function-level guards for skip/advance/begin (belt & braces under the click shield) */
(function(){
  function guard(name, ms){
    if(typeof window[name]!=='function') return;
    const _f=window[name];
    window[name]=function(){
      const now=Date.now();
      if(window[name]._t && now-window[name]._t<ms) return;
      window[name]._t=now;
      return _f.apply(this,arguments);
    };
  }
  guard('skipStep',350);
  guard('doAdvance',600);
  guard('startStage',350);
})();

/* v5.1: the phone actually rings — trrrn… trrrn… (respects the sound toggle) */
let _ringCtx=null, _ringTimer=null;
function _ringStart(){
  try{
    if(typeof Sound!=='undefined' && Sound.isOn && !Sound.isOn()) return;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    _ringCtx=_ringCtx||new AC(); const ctx=_ringCtx;
    if(ctx.state==='suspended'){ try{ ctx.resume(); }catch(e){} }
    const burst=(t0,len)=>{
      const master=ctx.createGain(); master.gain.setValueAtTime(0,t0);
      master.gain.linearRampToValueAtTime(0.16,t0+0.02); master.gain.setValueAtTime(0.16,t0+len-0.05); master.gain.linearRampToValueAtTime(0,t0+len);
      // buzzy "trrr": a fast tremolo chopping the tone
      const lfo=ctx.createOscillator(), lfoG=ctx.createGain(); lfo.type='square'; lfo.frequency.value=22; lfoG.gain.value=0.5;
      const chop=ctx.createGain(); chop.gain.value=0.5; lfo.connect(lfoG); lfoG.connect(chop.gain);
      [440,480].forEach(f=>{ const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f; o.connect(chop); o.start(t0); o.stop(t0+len+0.05); });
      chop.connect(master); master.connect(ctx.destination); lfo.start(t0); lfo.stop(t0+len+0.05);
    };
    const cycle=()=>{ const t=ctx.currentTime+0.02; burst(t,0.55); burst(t+0.75,0.55); };   // trrrn  trrrn
    _ringStop(); cycle(); _ringTimer=setInterval(cycle, 3000);
  }catch(e){}
}
function _ringStop(){ if(_ringTimer){ clearInterval(_ringTimer); _ringTimer=null; } }
(function(){
  const _s=_scene;
  _scene=function(cfg){
    if(cfg && cfg.ring!==false){
      _ringStart();
      const after=cfg.after; cfg=Object.assign({},cfg,{after:function(){ _ringStop(); if(after) after.apply(this,arguments); }});
      // stop the moment they pick up
      const stopOnAnswer=()=>{ const b=document.getElementById('callAns'); if(b){ b.addEventListener('click',_ringStop,{once:true}); } else setTimeout(stopOnAnswer,60); };
      setTimeout(stopOnAnswer,30);
    }
    return _s(cfg);
  };
})();

_partnerSVG=function(p){
  const cx=110, cy=104;
