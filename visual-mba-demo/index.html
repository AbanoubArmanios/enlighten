<!doctype html>
<html lang="en"><head><meta name="robots" content="noindex"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visual MBA · Enlighten</title>
<style>
@font-face{font-family:SG;src:url(assets/sg.ttf);font-weight:300 700}
@font-face{font-family:IN;src:url(assets/inter.otf);font-weight:400}
@font-face{font-family:IN;src:url(assets/inter-sb.otf);font-weight:600}
:root{--ink:#1B1233;--ink2:#3A2D5C;--muted:#6F6390;--v:#6C2BD9;--p:#FF5FA2;--a:#E6A700;--t:#ECE7FB;--w:#F8F6FF;--line:#E4DCF7;--g:linear-gradient(110deg,#6C2BD9,#FF5FA2 60%,#E6A700)}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{font-family:IN,system-ui,sans-serif;color:var(--ink);background:var(--w);display:flex;flex-direction:column}
h1,h2,h3,.sg{font-family:SG,sans-serif;letter-spacing:-.01em}
.top{display:flex;align-items:center;gap:16px;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line)}
.top img{height:34px}.top .ttl{font-family:SG;font-weight:700;font-size:18px}.top .bar{flex:1;max-width:360px;margin-left:auto;height:10px;background:var(--t);border-radius:99px;overflow:hidden}
.top .bar i{display:block;height:100%;width:0;background:var(--g);transition:width .4s}.top .pct{font-weight:600;font-size:14px;color:var(--muted);min-width:44px;text-align:right}
.wrap{flex:1;display:flex;min-height:0}
nav{width:300px;background:#fff;border-right:1px solid var(--line);overflow:auto;padding:10px}
nav button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:10px;border-radius:12px;cursor:pointer;font:inherit;color:var(--ink2)}
nav button:hover{background:var(--w)}nav button.on{background:var(--t);color:var(--ink)}nav button:disabled{opacity:.4;cursor:not-allowed}
nav .n{flex:0 0 30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:SG;font-weight:700;font-size:13px;background:var(--w);border:2px solid var(--line)}
nav .done .n{background:var(--v);border-color:var(--v);color:#fff}
nav small{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
nav b{font-weight:600;font-size:14px;line-height:1.3}
main{flex:1;overflow:auto;padding:28px 32px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;margin-top:18px;max-width:980px}
.k{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--v)}
h1{font-size:32px;margin:6px 0 4px}.vid{margin-top:16px;max-width:980px;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:16/9}
.vid video,.vid iframe{width:100%;height:100%;border:0;display:block}
.big{font-family:SG;font-weight:700;font-size:26px;color:var(--v)}
.tk{display:flex;gap:14px;margin:12px 0;line-height:1.5}.tk i{flex:0 0 30px;height:30px;border-radius:50%;background:var(--v);color:#fff;font-style:normal;font-family:SG;font-weight:700;display:flex;align-items:center;justify-content:center}
.try{border-left:5px solid var(--a);background:#FFF8E0;border-radius:0 14px 14px 0;padding:14px 18px;margin-top:14px;line-height:1.5}.try small{display:block;font-weight:600;color:#9A6F00;letter-spacing:.1em;font-size:11px;margin-bottom:4px}
.q{margin-top:16px}.q p{font-weight:600;margin-bottom:8px}
.q label{display:block;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;margin:6px 0;cursor:pointer}
.q label:hover{border-color:var(--v)}.q input{margin-right:10px;accent-color:var(--v)}
.q label.ok{border-color:#1E9E6A;background:#E9FBF2}.q label.bad{border-color:#D6453D;background:#FFECEF}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;font-family:SG;font-weight:700;font-size:16px;padding:13px 24px;border-radius:999px;background:linear-gradient(115deg,#6C2BD9,#FF5FA2);color:#fff;margin-top:16px}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.msg{margin-top:12px;font-weight:600}.msg.ok{color:#0B6B45}.msg.bad{color:#A3123A}
.cert{max-width:900px;margin:10px auto;background:#fff;border-radius:24px;padding:56px;text-align:center;border:10px solid transparent;background-clip:padding-box;position:relative;box-shadow:0 20px 60px -30px rgba(76,42,140,.5)}
.cert:before{content:"";position:absolute;inset:-10px;border-radius:30px;background:var(--g);z-index:-1}
.cert h2{font-size:44px;margin:14px 0}.cert .nm{font-family:SG;font-size:40px;font-weight:700;color:var(--v);margin:18px 0}
@media(max-width:820px){.wrap{flex-direction:column}nav{width:auto;max-height:180px;border-right:0;border-bottom:1px solid var(--line)}main{padding:18px}}
@media print{.top,nav,.noprint{display:none!important}main{padding:0}.cert{box-shadow:none}}
</style></head><body>
<div class="top"><img src="assets/logo.png" alt="Enlighten"><span class="ttl">Visual MBA</span><div class="bar"><i id="bar"></i></div><span class="pct" id="pct">0%</span></div>
<div class="wrap"><nav id="nav"></nav><main id="main"></main></div>
<script src="course.js"></script>
<script>
/* ---------- SCORM 1.2 wrapper (falls back to localStorage outside an LMS) ---------- */
const S={api:null,find(w){let n=0;while(w&&!w.API&&w.parent&&w.parent!==w&&n<10){w=w.parent;n++}return w&&w.API||null},
 init(){this.api=this.find(window)||(window.opener&&this.find(window.opener));if(this.api){this.api.LMSInitialize('');const s=this.api.LMSGetValue('cmi.core.lesson_status');if(!s||s==='not attempted')this.set('cmi.core.lesson_status','incomplete');}},
 get(k){if(this.api)return this.api.LMSGetValue(k);try{return localStorage.getItem('vmba:'+k)||''}catch(e){return''}},
 set(k,v){if(this.api){this.api.LMSSetValue(k,String(v));this.api.LMSCommit('')}else{try{localStorage.setItem('vmba:'+k,v)}catch(e){}}},
 finish(){if(this.api){this.api.LMSCommit('');this.api.LMSFinish('')}}};
S.init();window.addEventListener('beforeunload',()=>S.finish());
const P=new URLSearchParams(location.search), DEMO=true, M=COURSE, N=M.length;
let st={d:{},s:{},cur:0};try{const j=JSON.parse(S.get('cmi.suspend_data')||'{}');if(j.d)st=j}catch(e){}
const save=()=>{const done=Object.keys(st.d).length;S.set('cmi.suspend_data',JSON.stringify(st));S.set('cmi.core.lesson_location',st.cur);
 const sc=done?Math.round(Object.values(st.s).reduce((a,b)=>a+b,0)/N):0;S.set('cmi.core.score.raw',sc);S.set('cmi.core.score.min',0);S.set('cmi.core.score.max',100);
 if(done===N)S.set('cmi.core.lesson_status','passed');};
const unlocked=i=>DEMO?i<3:true;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function navR(){const done=Object.keys(st.d).length,p=Math.round(done/N*100);document.getElementById('bar').style.width=p+'%';document.getElementById('pct').textContent=p+'%';
 document.getElementById('nav').innerHTML=M.map((m,i)=>`<button class="${st.d[i]?'done':''} ${st.cur===i?'on':''}" ${unlocked(i)?'':'disabled'} onclick="go(${i})"><span class="n">${st.d[i]?'✓':m.n}</span><span><small>Episode ${m.n} · ${esc(m.topic)}</small><b>${esc(m.title)}</b></span></button>`).join('')
 +`<button class="${done===N?'':''}" ${done===N?'':'disabled'} onclick="cert()"><span class="n">★</span><span><small>Finish</small><b>Your certificate</b></span></button>`;}
function go(i){if(!unlocked(i))return;st.cur=i;save();const m=M[i];
 const vid=(!DEMO)?`<video controls preload="metadata" poster="media/ep${String(m.n).padStart(2,'0')}.jpg" src="media/ep${String(m.n).padStart(2,'0')}.mp4"></video>`:`<iframe src="https://www.youtube-nocookie.com/embed/${m.yt}?rel=0" allowfullscreen allow="encrypted-media"></iframe>`;
 document.getElementById('main').innerHTML=`<div class="k">Episode ${m.n} of ${N} · ${esc(m.topic)}</div><h1>${esc(m.title)}</h1>
 <div class="vid">${vid}</div>
 <div class="card"><div class="k">The big idea</div><div class="big" style="margin-top:6px">${esc(m.big)}</div>
 <div style="margin-top:14px">${m.tk.map((t,j)=>`<div class="tk"><i>${j+1}</i><span>${esc(t)}</span></div>`).join('')}</div>
 <div class="try"><small>TRY THIS AT WORK THIS WEEK</small>${esc(m.tr)}</div></div>
 <div class="card"><div class="k">Check your understanding</div>${m.q.map((q,j)=>`<div class="q" data-j="${j}"><p>${j+1}. ${esc(q.q)}</p>${q.o.map((o,k)=>`<label><input type="radio" name="q${j}" value="${k}">${esc(o)}</label>`).join('')}</div>`).join('')}
 <button class="btn" onclick="check(${i})">Check answers</button><div class="msg" id="msg"></div></div>`;
 document.getElementById('main').scrollTop=0;navR();}
function check(i){const m=M[i];let ok=0,all=true;document.querySelectorAll('.q').forEach((el,j)=>{const v=el.querySelector('input:checked');el.querySelectorAll('label').forEach(l=>l.className='');if(!v){all=false;return}
 const lab=v.parentElement;if(+v.value===m.q[j].c){ok++;lab.className='ok'}else lab.className='bad'});
 const msg=document.getElementById('msg');if(!all){msg.className='msg bad';msg.textContent='Answer both questions first.';return}
 if(st.s[i]==null)st.s[i]=Math.round(ok/m.q.length*100);
 if(ok===m.q.length){st.d[i]=1;save();navR();const nx=M.findIndex((_,k)=>!st.d[k]&&unlocked(k));msg.className='msg ok';
  msg.innerHTML=(Object.keys(st.d).length===N?'🎉 Course complete! ':'✓ Episode complete. ')+(Object.keys(st.d).length===N?`<button class="btn" onclick="cert()">Get your certificate</button>`:nx>=0?`<button class="btn" onclick="go(${nx})">Next episode →</button>`:(DEMO?'<br>That’s the end of the demo. <a href="https://enlightensim.org/visual-mba.html" target="_top">Get the full course for your team →</a>':''));}
 else{save();msg.className='msg bad';msg.textContent='Not quite. Rewatch the key moment and try again.'}}
function cert(){if(Object.keys(st.d).length<N)return;const nm=(S.get('cmi.core.student_name')||'').split(',').reverse().join(' ').trim()||'Learner';
 document.getElementById('main').innerHTML=`<div class="cert"><img src="assets/logo.png" style="height:56px"><div class="k" style="margin-top:22px">Certificate of completion</div><h2>Visual MBA</h2><p style="color:var(--muted)">This certifies that</p><div class="nm">${esc(nm)}</div>
 <p style="max-width:560px;margin:0 auto;line-height:1.6;color:var(--ink2)">has completed all 20 episodes of the Visual MBA: leadership, accounting, strategy, marketing, finance, operations, negotiation, ethics and more.</p>
 <p style="margin-top:26px;font-weight:600">${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})} · Enlighten · enlightensim.org</p></div>
 <div style="text-align:center" class="noprint"><button class="btn" onclick="print()">Print / save as PDF</button></div>`;navR();}
navR();go(Math.min(+st.cur||0,DEMO?2:N-1));
</script></body></html>
